<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShutterLink settings · Sport Shutter</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151726" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="assets/core.js?v=2.3"></script>
<script>try{const t=localStorage.getItem('shutterlink:ui-theme');if(t)document.documentElement.dataset.ui=t;}catch(_){}</script>
<style>
:root{
  --bg:#f6f6f9;--surface:#fff;--surface-2:#f8f8fb;--surface-3:#efeff5;--border:#e3e3ec;--border-strong:#cdcedb;
  --text:#16172b;--dim:#5b5e76;--faint:#666982;--accent:#2326D3;--accent-text:#2326D3;--accent-soft:rgba(35,38,211,.08);
  --ok:#0b7a4f;--warn:#975c05;--danger:#bf2f3d;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --font:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-ui=light]){
  --bg:#0d0e18;--surface:#151726;--surface-2:#1a1c2d;--surface-3:#22253a;--border:#272a40;--border-strong:#363a56;
  --text:#eceefa;--dim:#a3a7c3;--faint:#9195b1;--accent:#3b3fe6;--accent-text:#9a9dff;--accent-soft:rgba(110,114,255,.14);
  --ok:#3ecf8e;--warn:#f2a93b;--danger:#f0616d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2);color-scheme:dark;
}}
:root[data-ui=dark]{
  --bg:#0d0e18;--surface:#151726;--surface-2:#1a1c2d;--surface-3:#22253a;--border:#272a40;--border-strong:#363a56;
  --text:#eceefa;--dim:#a3a7c3;--faint:#9195b1;--accent:#3b3fe6;--accent-text:#9a9dff;--accent-soft:rgba(110,114,255,.14);
  --ok:#3ecf8e;--warn:#f2a93b;--danger:#f0616d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- Top bar + tabs ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.bar{max-width:1320px;margin:0 auto;height:58px;padding:0 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.015em;white-space:nowrap}
.brand .mk{width:24px;height:25px;color:var(--accent-text);display:block}
.brand .mk svg{width:100%;height:100%;display:block}
.crumb{color:var(--dim);font-weight:500;padding-left:12px;margin-left:2px;border-left:1px solid var(--border);white-space:nowrap}
.sp{flex:1}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);white-space:nowrap;margin-right:4px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.busy i{background:var(--accent-text);animation:pulse 1s ease infinite}
.saved.bad{color:var(--danger)} .saved.bad i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--border-strong);background:var(--surface-3)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.icon{width:36px;padding:0}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.tabs{max-width:1320px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 12px 10px;color:var(--dim);font-weight:600;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent-text)}

/* ---------- Layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:26px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:44px;align-items:start}
.content{max-width:760px;width:100%}
.pane-h h1{font-size:26px;letter-spacing:-.02em;line-height:1.15}
.pane-h p{color:var(--dim);margin-top:6px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:26px;flex-wrap:wrap}
.ph h2{font-size:15.5px;font-weight:700;letter-spacing:-.005em}
.ph .sub{color:var(--faint);font-size:12.5px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.help-b{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--dim);font-size:12px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.help-b:hover,.help-b[aria-expanded=true]{color:var(--accent-text);border-color:var(--accent-text);background:var(--accent-soft)}
.help{margin:-4px 0 16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent-text) 25%,transparent);font-size:13px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields{display:grid;gap:14px}
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }

/* Fields */
.f{display:grid;gap:6px;font-size:13px;font-weight:600;min-width:0}
.f > small,.hint{font-weight:400;color:var(--faint);font-size:12.5px;line-height:1.4}
.f .lab{display:flex;justify-content:space-between;gap:8px}
.f .lab span{font-weight:500;color:var(--faint)}
.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);font-size:14.5px;font-weight:400;transition:border-color .15s,box-shadow .15s,background-color .15s;min-width:0}
textarea.in{height:auto;min-height:72px;padding:9px 12px;resize:vertical;line-height:1.45}
select.in{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.in:focus{outline:none;border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.in[aria-invalid=true]{border-color:var(--danger)}
.ferr{font-size:12px;font-weight:500;color:var(--danger)}
.fok{font-size:12.5px;font-weight:600;color:var(--ok)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;justify-self:start}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}

.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent);height:24px;min-width:0}
.range output{min-width:46px;text-align:right;font-size:13px;color:var(--dim);font-weight:600}

.tg{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.tg:last-child{border-bottom:0;padding-bottom:0}
.tg:first-child{padding-top:0}
.tg b{display:block;font-weight:600}
.tg span{font-size:12.5px;color:var(--faint)}
.sw{position:relative;width:42px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--border-strong);transition:background-color .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--accent-text);outline-offset:2px}

/* Image field */
.img-f{display:flex;gap:8px;align-items:center}
.thumb{width:44px;height:44px;border-radius:8px;flex:none;background:var(--surface-3) center/cover no-repeat;border:1px solid var(--border)}
.thumb.lg{width:64px;height:64px;border-radius:10px}
.img-f .in{flex:1}
.up{position:relative;overflow:hidden;cursor:pointer}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.up:focus-within{outline:2px solid var(--accent-text);outline-offset:2px}

/* Lists */
.list{list-style:none;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.row.off > :not(.tools):not(.sw){opacity:.5}
.row .fields{gap:8px}
.row .in{height:36px;font-size:14px;background:var(--surface)}
.tools{display:flex;flex-direction:column;gap:2px}
.tool{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.tool:hover{background:var(--surface-3);color:var(--text)}
.tool.del:hover{color:var(--danger)}
.tool:disabled{opacity:.25;pointer-events:none}
.tool svg{width:15px;height:15px}
.add{margin-top:10px;height:42px;width:100%;border:1.5px dashed var(--border-strong);border-radius:12px;color:var(--accent-text);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.add:hover{border-color:var(--accent-text);background:var(--accent-soft)}
.add:disabled{opacity:.45;pointer-events:none}
.add svg{width:15px;height:15px}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adds .add{margin-top:10px}
.empty-l{color:var(--faint);font-size:13px;padding:4px 2px}

/* Theme cards */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:1.5px solid var(--border);border-radius:12px;padding:6px;text-align:left;background:var(--surface);transition:border-color .15s}
.theme:hover{border-color:var(--border-strong)}
.theme[aria-pressed=true]{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.theme .mini{height:78px;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
.theme .mini i{display:block;height:6px;border-radius:3px}
.theme .mini .pill{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%}
.theme .mini .card{position:absolute;left:10px;right:44px;bottom:10px;height:22px;border-radius:6px}
.theme b{display:block;font-size:12.5px;font-weight:600;padding:7px 4px 2px}

.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){ .colors{grid-template-columns:1fr} }
.cf{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.cf .pick{position:relative;width:38px;height:38px;border-radius:8px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cf .pick input{position:absolute;inset:-8px;width:54px;height:54px;border:0;padding:0;cursor:pointer}
.cf .t{flex:1;min-width:0}
.cf .t b{display:block;font-size:13px}
.cf .t input{width:100%;border:0;background:none;font-size:13px;color:var(--dim);font-family:ui-monospace,"SF Mono",Menlo,monospace;padding:0;height:20px;text-transform:uppercase}
.cf .t input:focus{outline:none;color:var(--text)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ck{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--dim)}
.ck i{width:7px;height:7px;border-radius:50%}
.ck.ok i{background:var(--ok)} .ck.warn i{background:var(--warn)} .ck.bad i{background:var(--danger)}
.ck b{color:var(--text);font-weight:600}

.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.font{border:1.5px solid var(--border);border-radius:12px;padding:14px;text-align:left;background:var(--surface-2)}
.font:hover{border-color:var(--border-strong)}
.font[aria-pressed=true]{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.font .d{font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font .b{font-size:12.5px;color:var(--dim);margin-top:6px}

.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){ .styles{grid-template-columns:1fr 1fr} }
.style{border:1.5px solid var(--border);border-radius:12px;padding:8px;text-align:left;background:var(--surface-2)}
.style:hover{border-color:var(--border-strong)}
.style[aria-pressed=true]{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.style .wf{display:block;height:112px;border-radius:8px;background:var(--surface-3);position:relative;overflow:hidden}
.style .wf i{position:absolute;display:block}
.style b{display:block;font-size:13px;padding:8px 4px 0}
.style > span:last-child{display:block;font-size:12px;color:var(--faint);padding:0 4px 4px}

.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pr{position:relative;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;text-align:left;background:var(--surface-2)}
.pr img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--surface-3)}
.pr b{display:block;font-size:12.5px;padding:7px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr span{display:block;font-size:11.5px;color:var(--faint);padding:0 8px 7px}
.pr i{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:700}
.pr[aria-pressed=true]{border-color:var(--accent-text)}
.pr[aria-pressed=true] i{background:var(--accent)}

.meter{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.meter div{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.meter.warn div{background:var(--warn)} .meter.bad div{background:var(--danger)}

/* ---------- Preview ---------- */
.pv{position:sticky;top:124px;display:flex;flex-direction:column;align-items:center;gap:12px}
.device{width:calc(400px * var(--k,1));height:calc(820px * var(--k,1));position:relative}
.device .shell{position:absolute;top:0;left:0;width:400px;height:820px;transform:scale(var(--k,1));transform-origin:0 0;border-radius:58px;background:#0b0c12;padding:11px;box-shadow:0 0 0 1px #2a2c38,0 0 0 4px #15161d,0 30px 70px -20px rgba(16,18,40,.5)}
.device iframe{width:100%;height:100%;border:0;border-radius:47px;display:block;background:#0f1120}
.device .island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:31px;border-radius:16px;background:#000;z-index:2;pointer-events:none}
.pv-bar{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--faint)}
.pv-bar a{color:var(--accent-text);font-weight:600}
@media (max-width:1080px){ .wrap{grid-template-columns:1fr} .pv{display:none} }
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:31;height:48px;padding:0 22px;border-radius:24px;background:var(--text);color:var(--bg);font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;align-items:center;gap:8px}
.fab svg{width:18px;height:18px}
@media (max-width:1080px){ .fab{display:inline-flex} }
.mpv{position:fixed;inset:0;z-index:50;background:#0b0c12;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.mpv.open{transform:none;visibility:visible;transition-delay:0s}
.mpv header{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.mpv header .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.mpv iframe{flex:1;border:0;width:100%}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:1081px){ .toast{bottom:28px} }
.toast.bad{background:var(--danger);color:#fff}

@media (max-width:640px){
  .bar{padding:0 10px;gap:4px}
  .crumb,.saved .lbl,.hide-s{display:none}
  .wrap{padding:18px 14px 110px}
  .panel{padding:16px 14px}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row > .thumb{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="https://sportshutter.com/" aria-label="ShutterLink by Sport Shutter, go to the Sport Shutter home page"><span class="mk" id="mk"></span><span>ShutterLink</span></a>
    <span class="crumb">Settings</span>
    <span class="sp"></span>
    <span class="saved" id="saved" role="status"><i></i><span class="lbl" id="savedT">All changes saved</span></span>
    <button class="btn ghost icon" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
    <button class="btn ghost icon" id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled></button>
    <button class="btn ghost icon hide-s" id="uiTheme" aria-label="Switch settings between light and dark" title="Light or dark"></button>
    <a class="btn primary" href="index.html">View page</a>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections"></nav>
</header>

<div class="wrap">
  <main class="content" id="content" role="tabpanel"></main>
  <aside class="pv" aria-label="Live preview">
    <div class="device" id="device"><div class="shell"><span class="island"></span><iframe id="frame" src="index.html?preview&v=2.3" title="Live preview of your link page"></iframe></div></div>
    <div class="pv-bar"><span>Live preview</span><span aria-hidden="true">·</span><a href="index.html" target="_blank" rel="noopener">Open in new tab</a></div>
  </aside>
</div>

<button class="fab" id="fab"></button>
<div class="mpv" id="mpv" role="dialog" aria-modal="true" aria-label="Preview">
  <header><b>Preview</b><button class="btn sm" id="mpvClose">Done</button></header>
  <iframe id="frame2" title="Live preview of your link page"></iframe>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = SL.esc, I = SL.ICONS;
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

/* ---------- Paths ---------- */
const get = (path, o=cfg) => path.split('.').reduce((a,k) => a == null ? a : a[k], o);
function set(path, v){ const ks = path.split('.'), last = ks.pop(); ks.reduce((a,k) => a[k], cfg)[last] = v; }

/* ---------- Save, preview, history ---------- */
let saveT, histT, hist = [JSON.stringify(cfg)], hp = 0;
function post(msg){
  msg = msg || { type:'shutterlink:config', config: cfg };
  [$('frame'), $('frame2')].forEach(f => { try { f.contentWindow && f.contentWindow.postMessage(msg, '*'); } catch(_){} });
}
function changed(opts={}){
  post();
  const s = $('saved'); s.className = 'saved busy'; $('savedT').textContent = 'Saving…';
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const r = SL.save(cfg);
    if (r.ok){ s.className = 'saved'; $('savedT').textContent = 'All changes saved'; }
    else {
      s.className = 'saved bad'; $('savedT').textContent = r.full ? 'Storage full' : 'Not saved';
      toast(r.full ? 'Browser storage is full. Remove an uploaded photo or use an image link instead.' : 'Couldn’t save in this browser.', true);
    }
    if (current === 'advanced') renderPane('advanced', true);
  }, 250);
  if (!opts.noHistory){ clearTimeout(histT); histT = setTimeout(pushHist, opts.immediate ? 0 : 500); }
}
function pushHist(){
  const snap = JSON.stringify(cfg);
  if (snap === hist[hp]) return;
  hist = hist.slice(0, hp + 1); hist.push(snap);
  if (hist.length > 120) hist.shift();
  hp = hist.length - 1; histButtons();
}
function histButtons(){ $('undo').disabled = hp <= 0; $('redo').disabled = hp >= hist.length - 1; }
function travel(d){
  clearTimeout(histT); pushHist();
  const n = hp + d; if (n < 0 || n >= hist.length) return;
  hp = n; cfg = JSON.parse(hist[hp]); histButtons();
  renderPane(current, true); changed({ noHistory:true });
  toast(d < 0 ? 'Undone' : 'Redone');
}
$('undo').onclick = () => travel(-1);
$('redo').onclick = () => travel(1);
addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const a = document.activeElement;
  if (/INPUT|TEXTAREA/.test(a.tagName) && !['checkbox','range','color','file'].includes(a.type)) return; // fields keep their own undo
  const k = e.key.toLowerCase();
  if (k === 'z'){ e.preventDefault(); travel(e.shiftKey ? 1 : -1); }
  if (k === 'y'){ e.preventDefault(); travel(1); }
});

function uiMode(){ return document.documentElement.dataset.ui || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function uiIcon(){ $('uiTheme').innerHTML = uiMode() === 'dark' ? ui.sun : ui.moon; }
$('uiTheme').onclick = () => { const n = uiMode() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.ui = n; try { localStorage.setItem('shutterlink:ui-theme', n); } catch(_){} uiIcon(); };

/* ---------- Building blocks ---------- */
function field(label, path, o={}){
  const v = get(path) ?? '';
  const attrs = `class="in" data-k="${path}" ${o.max ? `maxlength="${o.max}"` : ''} placeholder="${esc(o.ph||'')}" ${o.check ? `data-check="${o.check}" autocomplete="off" spellcheck="false"` : ''}`;
  const tag = o.area ? `<textarea ${attrs} rows="${o.rows||2}">${esc(v)}</textarea>` : `<input ${attrs} type="${o.type||'text'}" value="${esc(v)}">`;
  return `<label class="f"><span class="lab">${label}${o.max ? `<span class="num" data-count="${path}">${String(v).length}/${o.max}</span>` : ''}</span>${tag}${o.hint ? `<small>${o.hint}</small>` : ''}<span class="ferr" data-err="${path}" hidden></span></label>`;
}
const toggle = (title, sub, path) => `<div class="tg"><div><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div><label class="sw"><input type="checkbox" data-k="${path}" data-t="bool" ${get(path) ? 'checked' : ''} aria-label="${esc(title)}"><i></i></label></div>`;
const seg = (path, opts, label) => `<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l]) => `<button data-seg="${path}" data-v="${v}" aria-pressed="${String(get(path)) === String(v)}">${l}</button>`).join('')}</div>`;
const range = (path, min, max, step, unit, label) => `<div class="range"><input type="range" data-k="${path}" data-t="num" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${get(path)}" aria-label="${esc(label)}"><output class="num" data-out="${path}">${get(path)}${unit}</output></div>`;
function imgInput(path, label, withThumb){
  const v = get(path) || '', up = v.startsWith('data:');
  return `<div class="img-f">${withThumb ? `<span class="thumb lg" data-thumb="${path}" style="background-image:url('${esc(SL.sized(v,160,160))}')"></span>` : ''}
    <input class="in" data-k="${path}" data-check="url" data-img type="url" value="${up ? '' : esc(v)}" placeholder="${up ? 'Uploaded photo' : 'Paste an image link'}" autocomplete="off" spellcheck="false" aria-label="${esc(label)} link">
    <label class="btn sm up" title="Upload from your device">${ui.upload}<span class="hide-s">Upload</span><input type="file" accept="image/*" data-upload="${path}" aria-label="Upload ${esc(label)}"></label>
  </div><span class="ferr" data-err="${path}" hidden></span>`;
}
const tools = (list, i, len, extra='') => `<div class="tools">${extra}
  <button class="tool" data-act="up" data-list="${list}" data-i="${i}" aria-label="Move up" ${i===0?'disabled':''}>${ui.up}</button>
  <button class="tool" data-act="down" data-list="${list}" data-i="${i}" aria-label="Move down" ${i===len-1?'disabled':''}>${ui.down}</button>
  <button class="tool del" data-act="del" data-list="${list}" data-i="${i}" aria-label="Remove">${ui.del}</button></div>`;
let hid = 0;
function panel(title, body, o={}){
  const id = 'help' + (++hid);
  return `<section class="panel"><div class="ph"><h2>${title}</h2>${o.sub ? `<span class="sub" ${o.subId ? `id="${o.subId}"` : ''}>${o.sub}</span>` : ''}${o.help ? `<button class="help-b" aria-expanded="false" aria-controls="${id}" aria-label="About ${esc(title)}">?</button>` : ''}${o.act ? `<div class="act">${o.act}</div>` : ''}</div>
    ${o.help ? `<div class="help" id="${id}" hidden>${o.help}</div>` : ''}${body}</section>`;
}
const head = (t, p) => `<div class="pane-h"><h1>${t}</h1><p>${p}</p></div>`;
function checks(){
  const t = cfg.theme, tk = SL.tokens(t.colors);
  const ck = (label, r, min) => `<span class="ck ${r >= min ? 'ok' : r >= 3 ? 'warn' : 'bad'}"><i></i>${label} <b class="num">${r.toFixed(1)}:1</b></span>`;
  return ck('Text', SL.contrast(tk['--text'], tk['--bg']), 7) + ck('Secondary text', SL.contrast(tk['--text-dim'], tk['--bg']), 4.5)
    + ck('Button label', SL.contrast(tk['--on-accent'], t.colors.accent), 4.5) + ck('Accent links', SL.contrast(tk['--accent-text'], tk['--bg']), 4.5);
}

P.film = () => { const [cls, txt] = ytNote(cfg.film.url); return head('Film', 'Feature one video. YouTube links play right on your page.') +
  panel('Video', `<div class="fields">
    ${field('Video link', 'film.url', { type:'url', check:'url', ph:'https://youtube.com/watch?v=…' })}
    <span class="${cls}" id="ytNote">${txt}</span>
    <div class="grid2">${field('Title', 'film.title', { max:60 })}${field('Detail', 'film.meta', { max:30, ph:'e.g. 12 min' })}</div>
    <div class="f"><span>Cover image</span>${imgInput('film.thumb', 'Film cover', true)}<small>Leave empty to use the YouTube thumbnail.</small></div>
  </div>`); };

P.links = () => head('Links', 'Anything else you want people to find: portfolios, presets, workshops, gear.') +
  panel('Your links', `<ul class="list">${cfg.links.map((l,i) => `
    <li class="row ${l.on ? '' : 'off'}"><span class="thumb lg" data-thumb="links.${i}.thumb" style="background-image:url('${esc(SL.sized(l.thumb,160,160))}')"></span>
      <div class="fields">
        <div class="grid2"><input class="in" data-k="links.${i}.title" value="${esc(l.title)}" placeholder="Title" aria-label="Link ${i+1} title" maxlength="50"><input class="in" data-k="links.${i}.badge" value="${esc(l.badge)}" placeholder="Badge, e.g. New (optional)" aria-label="Link ${i+1} badge" maxlength="12"></div>
        <input class="in" data-k="links.${i}.sub" value="${esc(l.sub)}" placeholder="Short description (optional)" aria-label="Link ${i+1} description" maxlength="70">
        <input class="in" data-k="links.${i}.url" data-check="url" type="url" value="${esc(l.url)}" placeholder="https://…" aria-label="Link ${i+1} address" autocomplete="off" spellcheck="false"><span class="ferr" data-err="links.${i}.url" hidden></span>
        ${imgInput('links.' + i + '.thumb', 'Link ' + (i+1) + ' image', false)}
      </div>${tools('links', i, cfg.links.length, `<button class="tool" data-act="vis" data-list="links" data-i="${i}" aria-label="${l.on ? 'Hide' : 'Show'} link" aria-pressed="${!l.on}">${l.on ? ui.eye : ui.eyeOff}</button>`)}</li>`).join('') || '<li class="empty-l">No links yet.</li>'}</ul>
    <button class="add" data-act="add" data-list="links" ${cfg.links.length >= 20 ? 'disabled' : ''}>${ui.plus}Add link</button>`,
  { sub:`${cfg.links.filter(l => l.on).length} showing`, help:'Use the eye to hide a link and keep it for later. Links without an address show a prototype message for now.' });

P.contact = () => head('Contact', 'Your enquiry form and newsletter signup.') +
  panel('Enquiry form', `<div class="fields">
    ${field('Intro', 'enquire.intro', { area:true, max:200 })}
    ${field('Types of shoot', 'enquire.types', { hint:'Separate with commas. Leave empty to hide the dropdown.' })}
    ${field('Reply note', 'enquire.reply', { max:80, ph:'e.g. I usually reply within two days.' })}
    ${field('Send enquiries to', 'enquire.to', { type:'email', check:'email', ph:'you@example.com', hint:'For the prototype, visitors get a button to send it from their own email app.' })}
  </div>`) +
  panel('Newsletter', `<div class="fields">${field('Description', 'newsletter.blurb', { area:true, max:160 })}${field('Button label', 'newsletter.button', { max:16 })}</div>`);

P.socials = () => head('Socials', 'Leave any blank to hide that icon. Quick buttons for these networks use the same addresses.') +
  panel('Profiles', `<div class="grid2">${Object.entries(SL.SOCIALS).map(([k,s]) => field(s.label, 'socials.' + k, { type: k === 'email' ? 'email' : 'url', check: k === 'email' ? 'email' : 'url', ph:s.ph })).join('')}</div>`,
  { help:'Until you add at least one, the page shows sample icons so you can see the layout.' });

P.advanced = () => {
  const used = SL.bytes(cfg), cap = 5 * 1024 * 1024, pct = Math.min(100, used / cap * 100);
  const kb = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
  return head('Advanced', 'Back up, restore or start again.') +
  panel('Storage', `<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap"><span>Used by your settings and uploads</span><b class="num">${kb(used)} of about ${kb(cap)}</b></div>
    <div class="meter ${pct > 90 ? 'bad' : pct > 70 ? 'warn' : ''}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="Storage used"><div style="width:${Math.max(1,pct).toFixed(1)}%"></div></div>
    <p class="hint" style="margin-top:10px">For the prototype everything is saved in this browser. Uploaded photos use the most space; image links use almost none.</p>`) +
  panel('Backup', `<p class="hint" style="margin-bottom:14px">Download your settings as a file, or load a file you saved earlier.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="export">Download settings</button>
    <label class="btn up">Load settings file<input type="file" accept="application/json,.json" id="importFile" aria-label="Load settings file"></label></div>`) +
  panel('Start again', `<p class="hint" style="margin-bottom:14px">Replace everything with the demo content. You can undo this.</p><button class="btn danger" data-act="reset">Reset to demo content</button>`);
};

/* ---------- Tabs ---------- */
const fromHash = () => { const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : 'profile'; };
let current = fromHash();
$('tabs').innerHTML = TABS.map(([id,l]) => `<button class="tab" role="tab" id="tab-${id}" aria-controls="content" data-tab="${id}">${l}</button>`).join('');
function renderPane(id, keep){
  const y = scrollY, a = document.activeElement, focusKey = a && a.dataset ? (a.dataset.k || null) : null;
  current = id;
  $('content').innerHTML = P[id]();
  $('content').setAttribute('aria-labelledby', 'tab-' + id);
  document.querySelectorAll('.tab').forEach(t => { const s = t.dataset.tab === id; t.setAttribute('aria-selected', s); t.tabIndex = s ? 0 : -1; });
  if (keep){ scrollTo(0, y); if (focusKey){ const el = $('content').querySelector(`[data-k="${CSS.escape(focusKey)}"]`); if (el) el.focus({ preventScroll:true }); } }
  $('content').querySelectorAll('[data-check]').forEach(el => { if (el.value) validate(el); });
}
function go(id){
  if (id === current) return;
  history.replaceState(null, '', '#' + id);
  renderPane(id); scrollTo({ top:0 });
  $('tab-' + id).scrollIntoView({ block:'nearest', inline:'nearest' });
  post({ type:'shutterlink:focus', tab: id === 'contact' ? 'enquire' : id });
}
$('tabs').onclick = e => { const t = e.target.closest('.tab'); if (t) go(t.dataset.tab); };
$('tabs').onkeydown = e => {
  const i = TABS.findIndex(t => t[0] === current);
  const n = { ArrowRight:i+1, ArrowLeft:i-1, Home:0, End:TABS.length-1 }[e.key];
  if (n === undefined) return; e.preventDefault();
  const id = TABS[(n + TABS.length) % TABS.length][0]; go(id); $('tab-' + id).focus();
};
addEventListener('hashchange', () => go(fromHash()));

/* ---------- Validation ---------- */
function validate(el){
  const kind = el.dataset.check; if (!kind) return true;
  const v = el.value.trim();
  let msg = '';
  if (v && kind === 'url' && !/^https?:\/\//i.test(SL.href(v))) msg = 'Enter a full web address, like https://example.com';
  if (v && kind === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = 'Enter an email address, like you@example.com';
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  const er = $('content').querySelector(`[data-err="${CSS.escape(el.dataset.k)}"]`);
  if (er){ er.textContent = msg; er.hidden = !msg; }
  return !msg;
}

/* ---------- Events ---------- */
const content = $('content');
content.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k){
    const k = el.dataset.k;
    let v = el.dataset.t === 'bool' ? el.checked : el.dataset.t === 'num' ? +el.value : el.value;
    if (el.dataset.img !== undefined && !v.trim() && String(get(k) || '').startsWith('data:')) return; // empty link field keeps the upload
    set(k, v);
    const out = content.querySelector(`[data-out="${CSS.escape(k)}"]`); if (out) out.textContent = el.value + (el.dataset.unit || '');
    const cnt = content.querySelector(`[data-count="${CSS.escape(k)}"]`); if (cnt) cnt.textContent = `${el.value.length}/${el.maxLength}`;
    const th = content.querySelector(`[data-thumb="${CSS.escape(k)}"]`); if (th) th.style.backgroundImage = `url('${SL.sized(el.value,160,160)}')`;
    if (el.getAttribute('aria-invalid') === 'true') validate(el);
    if (k === 'film.url'){ const [c, t] = ytNote(el.value), n = $('ytNote'); n.className = c; n.textContent = t; }
    if (el.type === 'checkbox' && el.closest('.row')) el.closest('.row').classList.toggle('off', !el.checked);
    if (el.dataset.relabel !== undefined){
      const q = cfg.quick[+el.dataset.relabel];
      if (!q.label.trim() || Object.values(SL.ACTIONS).some(a => a.label === q.label)) q.label = SL.ACTIONS[q.type].label;
      changed({ immediate:true }); renderPane(current, true); return;
    }
    if (k === 'profile.name' && current === 'design') return changed();
    changed({ immediate: el.type === 'checkbox' || el.tagName === 'SELECT' });
    return;
  }
  if (el.dataset.color || el.dataset.hex){
    const key = el.dataset.color || el.dataset.hex;
    let v = el.value.trim(); if (!v.startsWith('#')) v = '#' + v;
    if (!SL.isHex(v)) { el.setAttribute('aria-invalid', 'true'); return; }
    el.removeAttribute('aria-invalid');
    if (v.length === 4) v = '#' + v.slice(1).split('').map(c => c + c).join('');
    cfg.theme.colors[key] = v.toLowerCase(); cfg.theme.preset = 'custom';
    const pick = content.querySelector(`[data-color="${key}"]`), hex = content.querySelector(`[data-hex="${key}"]`);
    if (el !== pick && pick) pick.value = v.toLowerCase();
    if (el !== hex && hex) hex.value = v.toLowerCase();
    if (pick) pick.parentElement.style.background = v;
    $('checks').innerHTML = checks();
    content.querySelectorAll('.theme').forEach(b => b.setAttribute('aria-pressed', 'false'));
    $('presetName').textContent = 'Custom';
    changed();
  }
});
content.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.check) validate(el);
  if (el.dataset.upload) upload(el.files[0], el.dataset.upload);
  if (el.dataset.uploadMany) uploadMany(el.files, el.dataset.uploadMany);
  if (el.id === 'importFile') importFile(el.files[0]);
  if (el.dataset.hex){ const k = el.dataset.hex; el.value = cfg.theme.colors[k]; el.removeAttribute('aria-invalid'); }
});
content.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.check) validate(e.target); });

content.addEventListener('click', e => {
  const t = e.target;
  const help = t.closest('.help-b');
  if (help){ const h = $(help.getAttribute('aria-controls')); h.hidden = !h.hidden; help.setAttribute('aria-expanded', String(!h.hidden)); return; }
  const sg = t.closest('[data-seg]');
  if (sg){ let v = sg.dataset.v; if (sg.dataset.seg === 'gallery.columns') v = +v; set(sg.dataset.seg, v); changed({ immediate:true }); renderPane(current, true); return; }
  const th = t.closest('[data-theme]');
  if (th){ const p = SL.THEMES.find(x => x.id === th.dataset.theme); cfg.theme.preset = p.id; cfg.theme.colors = { ...p.colors }; changed({ immediate:true }); renderPane('design', true); return; }
  const fo = t.closest('[data-font]');
  if (fo){ cfg.theme.font = fo.dataset.font; changed({ immediate:true }); renderPane('design', true); return; }
  const fe = t.closest('[data-feature]');
  if (fe){ const f = cfg.shop.featured, i = f.indexOf(fe.dataset.feature); if (i >= 0) f.splice(i, 1); else f.push(fe.dataset.feature); changed({ immediate:true }); renderPane('shop', true); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'swap'){
    const c = cfg.theme.colors, dark = SL.isDark(c.bg);
    cfg.theme.colors = dark
      ? { bg: SL.mix(c.text, '#ffffff', .55), surface:'#ffffff', text: SL.mix(c.bg, '#000000', .25), accent: c.accent }
      : { bg: SL.mix(c.text, '#000000', .3), surface: SL.mix(c.text, '#000000', .12), text: SL.mix(c.bg, '#ffffff', .5), accent: c.accent };
    cfg.theme.preset = 'custom'; changed({ immediate:true }); renderPane('design', true); return;
  }
  if (act === 'export'){
    const u = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], { type:'application/json' }));
    const l = document.createElement('a'); l.href = u; l.download = 'shutterlink-settings.json';
    document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
    toast('Settings downloaded'); return;
  }
  if (act === 'reset'){ cfg = SL.clone(SL.DEFAULTS); changed({ immediate:true }); renderPane(current, true); toast('Reset to demo content. Undo brings yours back.'); return; }
  const list = a.dataset.list; if (!list) return;
  const arr = get(list), i = +a.dataset.i;
  if (act === 'up' && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  if (act === 'down' && i < arr.length - 1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
  if (act === 'del'){ arr.splice(i, 1); toast('Removed. Undo brings it back.'); }
  if (act === 'vis') arr[i].on = !arr[i].on;
  if (act === 'add'){
    if (list === 'links') arr.push({ title:'', sub:'', url:'', thumb:'', on:true, badge:'' });
    if (list === 'quick'){ const used = new Set(arr.map(q => q.type)); const type = Object.keys(SL.ACTIONS).find(k => !used.has(k)) || 'link'; arr.push({ type, label:SL.ACTIONS[type].label, url:'' }); }
    if (list === 'cover.photos'){ const ids = [1019,1022,1025,1040,1047,1053,1057,1067,1069,1074]; arr.push({ url: SL.pic(ids[arr.length % ids.length], 1080, 1350), caption:'' }); }
  }
  changed({ immediate:true }); renderPane(current, true);
  const ni = act === 'up' ? i - 1 : act === 'down' ? i + 1 : i;
  const again = content.querySelector(`[data-act="${act}"][data-list="${list}"][data-i="${ni}"]`);
  if (act === 'add'){ const rows = content.querySelectorAll('.list > .row'); const inp = rows[rows.length - 1]?.querySelector('input.in, select.in'); if (inp) inp.focus(); }
  else if (again && !again.disabled) again.focus();
});

/* ---------- Uploads & import ---------- */
async function upload(file, path){
  if (!file) return;
  try { set(path, await SL.readImage(file, /thumb|avatar/.test(path) ? 600 : 1600)); changed({ immediate:true }); renderPane(current, true); toast('Photo added'); }
  catch(err){ toast(err.message, true); }
}
async function uploadMany(files, list){
  const arr = get(list), cap = list === 'cover.photos' ? 10 : 24;
  const pick = [...files].slice(0, Math.max(0, cap - arr.length));
  if (!pick.length){ toast(`You can have up to ${cap} photos here.`, true); return; }
  let n = 0;
  for (const f of pick){ try { arr.push({ url: await SL.readImage(f, 1600), caption:'' }); n++; } catch(err){ toast(err.message, true); } }
  if (n) toast(files.length > pick.length ? `Added ${n}. That’s the limit of ${cap}.` : `Added ${n} photo${n > 1 ? 's' : ''}`);
  changed({ immediate:true }); renderPane(current, true);
}
async function importFile(file){
  if (!file) return;
  try { cfg = SL.fromJSON(await file.text()); changed({ immediate:true }); renderPane(current, true); toast('Settings loaded'); }
  catch(_){ toast('That file isn’t a ShutterLink settings file.', true); }
}

/* ---------- Preview ---------- */
function fit(){ $('device').style.setProperty('--k', Math.max(.55, Math.min(1, (innerHeight - 180) / 820)).toFixed(3)); }
addEventListener('resize', fit); fit();
$('frame').addEventListener('load', () => post());
$('frame2').addEventListener('load', () => post());
$('fab').onclick = () => { const f = $('frame2'); if (!f.getAttribute('src')) f.src = 'index.html?preview&v=2.3'; else post(); $('mpv').classList.add('open'); $('mpvClose').focus(); };
$('mpvClose').onclick = () => { $('mpv').classList.remove('open'); $('fab').focus(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && $('mpv').classList.contains('open')) $('mpvClose').click(); });
// another tab changed settings (e.g. reset elsewhere)
addEventListener('storage', e => { if (e.key === SL.KEY){ cfg = SL.load(); renderPane(current, true); post(); } });

let tt;
function toast(m, bad){ const el = $('toast'); el.textContent = m; el.classList.toggle('bad', !!bad); el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), bad ? 4500 : 2400); }

renderPane(current);
histButtons();
})();
</script>
