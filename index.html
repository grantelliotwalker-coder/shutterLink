<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mara Ellison — Photography</title>
<meta name="description" content="Prints, sessions and films from Mara Ellison, landscape and wedding photographer in the Blue Mountains.">
<meta name="theme-color" content="#1c2a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (swap these for real branding later) ---------- */
:root{
  --tint: #1c2a2e;          /* set per hero photo by JS */
  --accent: #2326D3;        /* from settings */
  --paper: #f3f4f1;
  --ink: #15191a;
  --mist: #9aa5a6;
  --line: rgba(243,244,241,.16);
  --glass: rgba(243,244,241,.08);
  --radius-lg: 22px;
  --radius-sm: 12px;
  --sans: "Familjen Grotesk", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--paper);
  background:var(--tint);
  transition:background-color .9s ease;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit;color:inherit}
a{text-decoration:none}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}

/* Desktop: blurred photo backdrop behind a phone-width column */
.backdrop{
  position:fixed;inset:0;z-index:-1;
  background-size:cover;background-position:center;
  filter:blur(60px) saturate(1.1) brightness(.55);
  transform:scale(1.2);
  opacity:0;transition:opacity .9s ease;
}
@media (min-width:600px){ .backdrop{opacity:1} }

.page{max-width:460px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* ---------- Hero: the photos are the page ---------- */
.hero{
  position:relative;overflow:hidden;
  height:100vh;height:100svh;min-height:540px;
  background:var(--tint);scroll-snap-align:start;
  user-select:none;-webkit-user-select:none;
}
@media (min-width:600px){ .hero{margin-top:24px;height:min(calc(100svh - 48px),900px);border-radius:var(--radius-lg)} }
.frame{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.04);
  transition:opacity .7s ease, transform 6s ease-out;
}
.frame.on{opacity:1;transform:scale(1)}
.hero::after{ /* legibility fade */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 20%,transparent 42%,color-mix(in srgb,var(--tint) 70%,transparent) 68%,var(--tint) 100%);
  transition:background .9s ease;
}
.ticks{position:absolute;top:calc(56px + env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:4px;z-index:3}
.tick{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.tick i{display:block;height:100%;width:0;background:#fff}
.tick.done i{width:100%}
.tick.now i{animation:fill var(--dur,5s) linear forwards}
.paused .tick.now i{animation-play-state:paused}
@keyframes fill{to{width:100%}}

.tap{position:absolute;top:0;bottom:45%;width:40%;z-index:2}
.tap.prev{left:0}.tap.next{right:0}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:10;max-width:460px;margin:0 auto;
  height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
  transition:background-color .3s ease, backdrop-filter .3s ease;
}
.topbar.solid{
  background:color-mix(in srgb,var(--tint) 82%,transparent);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
@media (min-width:600px){ .topbar{top:24px;border-radius:var(--radius-lg) var(--radius-lg) 0 0} }
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em;height:44px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:#2326D3;display:grid;place-items:center}
.logo svg{width:18px;height:19px}
.bar-actions{display:flex;gap:6px}
.icon-btn.gear{display:flex}
.preview .gear{display:none}
[hidden]{display:none!important}
.icon-btn{
  position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.icon-btn svg{width:18px;height:18px}
.cart-count{
  position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;display:none;place-items:center;
}
.cart-count.show{display:grid}

.id{position:absolute;left:22px;right:22px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
.body{scroll-snap-align:start}
.body,.body section{scroll-margin-top:calc(44px + env(safe-area-inset-top))}
.quick{display:flex;justify-content:space-between;margin:26px -4px 0;max-width:340px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;width:72px;font-size:13px;font-weight:500}
.quick i{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:rgba(243,244,241,.12);border:1px solid rgba(243,244,241,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .15s ease, background .2s ease;
}
.quick a:first-child i{background:var(--accent);color:#fff;border-color:transparent}
.quick a:hover i{background:rgba(243,244,241,.2)}
.quick a:first-child:hover i{background:color-mix(in srgb,var(--accent) 85%,#fff)}
.quick a:active i{transform:scale(.92)}
.quick svg{width:23px;height:23px}
.more{display:grid;place-items:center;width:44px;height:36px;margin:14px auto 0;opacity:.6}
.more svg{width:22px;height:22px;animation:nudge 2.4s ease-in-out 1.5s 3}
@keyframes nudge{50%{transform:translateY(4px)}}
@media (max-height:700px){ .name{font-size:44px} .quick{margin-top:18px} .bio{margin-top:6px} }
.name{
  font-weight:700;font-size:clamp(44px,13vw,60px);line-height:.92;letter-spacing:-.035em;
}
.bio{margin-top:10px;font-size:15px;line-height:1.4;color:rgba(243,244,241,.82);max-width:30ch}
.caption{
  position:absolute;left:22px;top:calc(72px + env(safe-area-inset-top));z-index:3;
  font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.3;
  color:rgba(255,255,255,.85);max-width:60%;text-shadow:0 1px 8px rgba(0,0,0,.4);
}

/* ---------- Content ---------- */
.body{padding:8px 18px 0}
.body > section:first-child h2,.body > section:first-child .shop-head a{margin-top:26px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:56px;border-radius:var(--radius-sm);font-weight:600;font-size:16px;
  transition:transform .15s ease, background .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--paper);color:var(--tint)}
.btn-ghost{border:1px solid var(--line);background:var(--glass)}
.btn-ghost:hover{background:rgba(243,244,241,.14)}

h2{font-size:15px;font-weight:600;color:var(--mist);margin:34px 4px 12px;letter-spacing:.005em}

/* Shop strip */
.shop-head{display:flex;align-items:baseline;justify-content:space-between}
.shop-head a{font-size:14px;color:var(--paper);opacity:.75;margin:34px 4px 12px}
.strip{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -18px;padding:0 18px 4px;scroll-padding:0 18px;scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.print{flex:0 0 42%;scroll-snap-align:start;text-align:left}
.print .ph{aspect-ratio:4/5;border-radius:var(--radius-sm);overflow:hidden;background:var(--glass)}
.print img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.print:hover img{transform:scale(1.04)}
.print b{display:block;font-weight:600;font-size:14px;margin-top:8px}
.print span{font-size:13px;color:var(--mist)}

/* Feature film */
.film{
  display:block;position:relative;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:16/9;
}
.film img{width:100%;height:100%;object-fit:cover}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 60%)}
.film .play{
  position:absolute;left:16px;bottom:16px;z-index:2;display:flex;align-items:center;gap:12px;
}
.film .play i{
  width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;
}
.film .play i svg{width:16px;height:16px;fill:var(--ink);margin-left:2px}
.film .play b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.film .play span{font-size:13px;opacity:.75}

/* Link list */
.links{list-style:none;border-top:1px solid var(--line)}
.links a{
  display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);
  transition:padding .2s ease;
}
.links a:hover{padding-left:10px}
.links img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.links .t{flex:1;min-width:0}
.links b{display:block;font-weight:600;font-size:16px}
.links span{font-size:13px;color:var(--mist)}
.links svg{width:16px;height:16px;opacity:.5;flex:none}

/* Socials */
.social{display:flex;justify-content:center;gap:10px;margin-top:34px}
.social a{
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);transition:background .2s ease;
}
.social a:hover{background:var(--glass)}
.social svg{width:20px;height:20px}

.foot{text-align:center;margin-top:28px;font-size:12px;color:var(--mist)}
.foot b{font-weight:600;color:var(--paper)}

/* ---------- Bottom sheet (print detail + cart) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;
  background:var(--paper);color:var(--ink);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s .4s;
  max-height:92vh;overflow-y:auto;
}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.grab{width:40px;height:4px;border-radius:2px;background:#cfd3d0;margin:0 auto 14px}
.sheet .ph{aspect-ratio:3/2;border-radius:var(--radius-sm);overflow:hidden}
.sheet .ph img{width:100%;height:100%;object-fit:cover}
.sheet h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:16px}
.sheet p{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45;color:#4d5556;margin-top:4px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.size{
  border:1.5px solid #d6dad7;border-radius:10px;padding:10px 6px;text-align:center;
  transition:border-color .15s ease, background .15s ease;
}
.size b{display:block;font-size:15px;font-weight:600}
.size span{font-size:13px;color:#636b6c}
.size[aria-pressed="true"]{border-color:var(--accent);background:#fff}
.sheet .btn-solid{width:100%;margin-top:18px;background:var(--accent);color:#fff}
.sheet .fine{font-size:13px;color:#636b6c;text-align:center;margin-top:10px}

.cart-list{list-style:none;margin-top:6px}
.cart-list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e1e4e1}
.cart-list img{width:52px;height:52px;border-radius:8px;object-fit:cover}
.cart-list .t{flex:1}
.cart-list b{display:block;font-weight:600}
.cart-list span{font-size:13px;color:#636b6c}
.cart-list button{font-size:13px;color:#636b6c;text-decoration:underline}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin-top:16px}
.empty{font-family:var(--serif);font-style:italic;color:#636b6c;padding:24px 0;text-align:center;font-size:17px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:999px;
  font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);
  transition:opacity .25s ease, transform .25s ease;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .frame{transform:none}
  html{scroll-behavior:auto}
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="backdrop" id="backdrop"></div>

<header class="topbar" id="topbar">
  <a class="logo" id="logo" href="https://sportshutter.com/">
    <span class="mark"></span>
    <span>Sport Shutter</span>
  </a>
  <div class="bar-actions">
    <button class="icon-btn" id="shareBtn" aria-label="Share this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
    </button>
    <button class="icon-btn" id="cartBtn" aria-label="Open cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <a class="icon-btn gear" href="settings.html" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </div>
</header>

<main class="page">
  <section class="hero" id="hero" aria-roledescription="slideshow" aria-label="Recent work">
    <div class="ticks" id="ticks"></div>
    <button class="tap prev" id="prev" aria-label="Previous photo"></button>
    <button class="tap next" id="next" aria-label="Next photo"></button>
    <div class="id">
      <h1 class="name" id="name"></h1>
      <p class="bio" id="bio"></p>
      <nav class="quick" id="quick" aria-label="Quick links"></nav>
      <a class="more" href="#detail" aria-label="Scroll for prints, films and more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </section>

  <div class="body" id="detail">
    <section id="shop" aria-labelledby="shop-h">
      <div class="shop-head">
        <h2 id="shop-h">Prints</h2>
        <a href="#" data-demo="Full shop" id="seeAll"></a>
      </div>
      <div class="strip" id="strip"></div>
    </section>

    <section id="film" aria-labelledby="film-h">
      <h2 id="film-h">Latest film</h2>
      <a class="film" id="filmCard" href="#">
        <img id="filmThumb" src="" alt="" loading="lazy">
        <div class="play">
          <i><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></i>
          <div><b id="filmTitle"></b><span id="filmMeta"></span></div>
        </div>
      </a>
    </section>

    <section id="linksSec" aria-labelledby="links-h">
      <h2 id="links-h">More from me</h2>
      <ul class="links" id="links"></ul>
    </section>

    <nav class="social" id="social" aria-label="Social profiles"></nav>

    <p class="foot">Made with <b>Shutterlink</b> for <b>Sport Shutter</b></p>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.documentElement.classList.add('preview');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SIZES = [ { label:'A4', mult:1 }, { label:'A3', mult:1.6 }, { label:'A2', mult:2.5 } ];
const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
let cfg = slLoad();
let PRINTS = [];

$('logo').querySelector('.mark').innerHTML = SL_BRAND.logo;
$('logo').setAttribute('aria-label', SL_BRAND.name + ' home');

/* Turn a config destination into an href, or a demo toast when it's empty. */
function linkAttrs(url, demoName){
  if (url && url.trim()) {
    const u = url.includes('@') && !url.startsWith('http') ? 'mailto:' + url.trim() : url.trim();
    return `href="${slEsc(u)}" target="_blank" rel="noopener"`;
  }
  return `href="#" data-demo="${slEsc(demoName)}"`;
}
function quickHref(q){
  if (q.type === 'shop') return 'href="#shop"';
  if (q.type === 'film') return 'href="#film"';
  if (SL_ACTIONS[q.type]?.social) return linkAttrs(cfg.socials[q.type], SL_ACTIONS[q.type].label);
  return linkAttrs(q.url, q.label || 'that link');
}

/* ---------- Render everything from cfg ---------- */
function render(){
  document.title = `${cfg.profile.name} — Photography`;
  document.documentElement.style.setProperty('--accent', cfg.look.accent);
  const parts = cfg.profile.name.trim().split(/\s+/);
  $('name').innerHTML = parts.length > 1
    ? slEsc(parts.slice(0, Math.ceil(parts.length/2)).join(' ')) + '<br>' + slEsc(parts.slice(Math.ceil(parts.length/2)).join(' '))
    : slEsc(cfg.profile.name);
  $('bio').textContent = cfg.profile.bio;

  $('quick').innerHTML = cfg.quick.filter(q => q.type).slice(0,4).map(q =>
    `<a ${quickHref(q)}><i>${SL_ICONS[q.type] || SL_ICONS.link}</i><span>${slEsc(q.label || SL_ACTIONS[q.type]?.label)}</span></a>`).join('');

  // prints
  PRINTS = SL_SHOP.slice(0, cfg.shopCount);
  $('shop').hidden = !cfg.sections.shop;
  $('seeAll').textContent = `See all ${SL_SHOP.length}`;
  $('strip').innerHTML = PRINTS.map((p,i) => `
    <button class="print" data-i="${i}">
      <div class="ph"><img src="${pic(p.id,400,500)}" alt="" loading="lazy"></div>
      <b>${slEsc(p.title)}</b><span>From $${p.from}</span>
    </button>`).join('');

  // film
  $('film').hidden = !cfg.sections.film;
  $('filmTitle').textContent = cfg.film.title;
  $('filmMeta').textContent = cfg.film.meta;
  $('filmThumb').src = cfg.film.thumb || '';
  const fc = $('filmCard'); fc.removeAttribute('data-demo'); fc.removeAttribute('target');
  fc.outerHTML = fc.outerHTML.replace(/^<a[^>]*>/, `<a class="film" id="filmCard" ${linkAttrs(cfg.film.url, 'the video')}>`);

  // links
  const links = cfg.links.filter(l => l.on && l.title);
  $('linksSec').hidden = !cfg.sections.links || !links.length;
  $('links').innerHTML = links.map(l => `
    <li><a ${linkAttrs(l.url, l.title)}>
      ${l.thumb ? `<img src="${slEsc(l.thumb)}" alt="">` : ''}
      <div class="t"><b>${slEsc(l.title)}</b>${l.sub ? `<span>${slEsc(l.sub)}</span>` : ''}</div>
      ${chevron}</a></li>`).join('');

  // socials: show each network that has an address, or all four as demos if none are set
  const nets = ['instagram','youtube','tiktok','email'];
  const anySet = nets.some(n => cfg.socials[n]);
  $('social').hidden = !cfg.sections.socials;
  $('social').innerHTML = nets.filter(n => !anySet || cfg.socials[n]).map(n =>
    `<a ${linkAttrs(cfg.socials[n], SL_ACTIONS[n].label)} aria-label="${SL_ACTIONS[n].label}">${SL_ICONS[n]}</a>`).join('');

  renderHero();
}

/* ---------- Hero slideshow ---------- */
const hero = $('hero'), ticks = $('ticks'), caption = $('caption'), backdrop = $('backdrop');
let idx = 0, timer, frames = [], tickEls = [];

function tintFrom(im, fallback){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, 8, 8);
    const d = x.getImageData(0, 0, 8, 8).data; let r=0,g=0,b=0;
    for (let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
    const hex = '#' + [r,g,b].map(v => Math.round(v/64).toString(16).padStart(2,'0')).join('');
    return slMix(hex, '#101214', .62);
  } catch(_) { return fallback; }
}
function bgFor(f){
  if (cfg.look.background === 'brand') return slMix(cfg.look.accent, '#07081a', .72);
  if (cfg.look.background === 'charcoal') return '#1b1d20';
  return f.tint || '#1c2a2e';
}
function renderHero(){
  hero.querySelectorAll('.frame').forEach(e => e.remove());
  ticks.innerHTML = '';
  const photos = cfg.photos.filter(f => f.url);
  frames = photos.map((f,i) => {
    const im = new Image();
    im.className = 'frame'; im.alt = f.caption || ''; im.src = f.url;
    if (!f.tint || f.auto) { // sample a colour from photos added in settings
      const probe = new Image(); probe.crossOrigin = 'anonymous';
      probe.onload = () => { f.tint = tintFrom(probe, f.tint); f.auto = true; if (i===idx) show(idx, true); };
      probe.src = f.url;
    }
    hero.insertBefore(im, ticks);
    ticks.insertAdjacentHTML('beforeend','<div class="tick"><i></i></div>');
    im._f = f; return im;
  });
  tickEls = ticks.querySelectorAll('.tick');
  ticks.hidden = frames.length < 2;
  ticks.style.setProperty('--dur', cfg.look.slideSeconds + 's');
  show(Math.min(idx, Math.max(frames.length-1, 0)));
}
function show(n, keepTimer){
  if (!frames.length){ setTint(bgFor({})); caption.textContent=''; return; }
  idx = (n + frames.length) % frames.length;
  const f = frames[idx]._f;
  setTint(bgFor(f));
  if (keepTimer) return;
  frames.forEach((el,i) => el.classList.toggle('on', i===idx));
  tickEls.forEach((t,i) => {
    t.className = 'tick' + (i<idx ? ' done' : i===idx ? ' now' : '');
    const bar = t.firstChild; bar.style.animation='none'; bar.offsetWidth; bar.style.animation='';
  });
  caption.textContent = f.caption || '';
  backdrop.style.backgroundImage = `url("${f.url}")`;
  clearTimeout(timer);
  if (!reduce && frames.length > 1) timer = setTimeout(() => show(idx+1), cfg.look.slideSeconds*1000);
}
function setTint(t){
  document.documentElement.style.setProperty('--tint', t);
  document.querySelector('meta[name=theme-color]').content = t;
}
$('prev').onclick = () => show(idx-1);
$('next').onclick = () => show(idx+1);
hero.addEventListener('pointerdown', e => { if (e.target.closest('.quick,.more')) return; hero.classList.add('paused'); clearTimeout(timer); });
['pointerup','pointerleave'].forEach(e => hero.addEventListener(e, () => {
  if (!hero.classList.contains('paused')) return;
  hero.classList.remove('paused');
  if (!reduce && frames.length > 1) timer = setTimeout(() => show(idx+1), 2500);
}));

/* ---------- Top bar ---------- */
const topbar = $('topbar');
const onScroll = () => topbar.classList.toggle('solid', scrollY > hero.offsetHeight * 0.5);
addEventListener('scroll', onScroll, {passive:true}); onScroll();

/* ---------- Shop ---------- */
$('strip').addEventListener('click', e => { const b = e.target.closest('.print'); if (b) openPrint(+b.dataset.i); });

const sheet = $('sheet'), scrim = $('scrim'); let lastFocus;
function openSheet(html, label){
  lastFocus = document.activeElement;
  sheet.innerHTML = '<div class="grab"></div>' + html;
  sheet.setAttribute('aria-label', label);
  sheet.classList.add('open'); scrim.classList.add('open');
  setTimeout(() => (sheet.querySelector('button') || sheet).focus(), 50);
}
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); lastFocus && lastFocus.focus(); }
scrim.onclick = closeSheet;
addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });
let y0=null;
sheet.addEventListener('touchstart', e => { if (sheet.scrollTop===0) y0 = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend', e => { if (y0!==null && e.changedTouches[0].clientY - y0 > 80) closeSheet(); y0=null; });

function openPrint(i){
  const p = PRINTS[i]; let s = 0;
  const price = k => Math.round(p.from * SIZES[k].mult);
  openSheet(`
    <div class="ph"><img src="${pic(p.id,900,600)}" alt="${slEsc(p.title)}"></div>
    <h3>${slEsc(p.title)}</h3><p>${slEsc(p.blurb)}</p>
    <div class="sizes" role="group" aria-label="Print size">
      ${SIZES.map((z,k)=>`<button class="size" data-k="${k}" aria-pressed="${k===0}"><b>${z.label}</b><span>$${price(k)}</span></button>`).join('')}
    </div>
    <button class="btn btn-solid" id="addBtn">Add to cart, $${price(0)}</button>
    <p class="fine">Giclée on cotton rag paper. Ships in 5 days.</p>`, p.title);
  sheet.querySelector('.sizes').onclick = e => {
    const b = e.target.closest('.size'); if (!b) return;
    s = +b.dataset.k;
    sheet.querySelectorAll('.size').forEach(x => x.setAttribute('aria-pressed', x===b));
    $('addBtn').textContent = `Add to cart, $${price(s)}`;
  };
  $('addBtn').onclick = () => {
    cart.push({ p, s, price: price(s) }); updateCart(); closeSheet();
    toast(`Added ${p.title} (${SIZES[s].label}) to cart`);
  };
}

const cart = [];
function updateCart(){ $('cartCount').textContent = cart.length; $('cartCount').classList.toggle('show', cart.length > 0); }
function openCart(){
  if (!cart.length){
    openSheet(`<h3>Cart</h3><p class="empty">Your cart is empty. Pick a print to get started.</p>
      <button class="btn btn-solid" id="browse">Browse prints</button>`, 'Cart');
    $('browse').onclick = () => { closeSheet(); $('shop').scrollIntoView(); };
    return;
  }
  const total = cart.reduce((a,c) => a + c.price, 0);
  openSheet(`<h3>Cart</h3>
    <ul class="cart-list">${cart.map((c,n) => `
      <li><img src="${pic(c.p.id,120,120)}" alt="">
        <div class="t"><b>${slEsc(c.p.title)}</b><span>${SIZES[c.s].label} print</span></div>
        <div style="text-align:right"><b>$${c.price}</b><button data-n="${n}">Remove</button></div></li>`).join('')}
    </ul>
    <div class="total"><span>Total</span><span>$${total} AUD</span></div>
    <button class="btn btn-solid" id="checkout">Check out</button>
    <p class="fine">Shipping calculated at checkout.</p>`, 'Cart');
  sheet.querySelector('.cart-list').onclick = e => {
    const b = e.target.closest('button[data-n]'); if (!b) return;
    cart.splice(+b.dataset.n, 1); updateCart(); openCart();
  };
  $('checkout').onclick = () => { closeSheet(); toast('Prototype: this would open Sport Shutter checkout'); };
}
$('cartBtn').onclick = openCart;

$('shareBtn').onclick = async () => {
  try {
    if (navigator.share) await navigator.share({ title: document.title, url: location.href.split('?')[0] });
    else { await navigator.clipboard.writeText(location.href.split('?')[0]); toast('Link copied'); }
  } catch(_) {}
};

const toastEl = $('toast'); let tt;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 2400);
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-demo]'); if (!a) return;
  e.preventDefault(); toast(`Prototype: this would open ${a.dataset.demo}`);
});
if (PREVIEW) document.addEventListener('click', e => {
  const a = e.target.closest('a[target=_blank], .logo'); if (!a) return;
  e.preventDefault(); toast('Links open on the live page');
});

/* ---------- Live updates from settings ---------- */
addEventListener('message', e => {
  if (e.origin !== location.origin && location.origin !== 'null') return;
  if (e.data?.type === 'shutterlink:config') { cfg = e.data.config; render(); }
});
addEventListener('storage', e => { if (e.key === SL_KEY) { cfg = slLoad(); render(); } });

render();
</script>
</body>
</html>
