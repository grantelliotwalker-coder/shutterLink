<meta property="og:site_name" content="Sport Shutter">
<meta property="og:title" content="Mara Ellison · Photography">
<meta property="og:description" content="Prints, bookings, films and links.">
<meta property="og:image" content="assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://picsum.photos">
<script src="assets/core.js?v=2.2"></script>
<script>
  /* Paint the saved theme before first render so there's no flash of the wrong colours. */
  try { SL.applyTheme(SL.load()); } catch(_) {}
</script>
<style>
/* safe areas; the settings preview fakes an iPhone's so the layout matches a real phone */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html.preview{--sat:50px;--sab:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(60px + var(--sat))}
body{
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  background:var(--bg);color:var(--text);min-height:100vh;
  transition:background-color .8s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,a,input,select,textarea{font:inherit;color:inherit}
a{text-decoration:none}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* images fade in once loaded; broken ones fall back to a quiet surface */
img.fade{opacity:0;transition:opacity .5s ease}
img.fade.ready{opacity:1}
img.broken{opacity:0!important}

/* ---------- Page column (phone width; desktop gets a soft backdrop) ---------- */
.page{max-width:480px;margin:0 auto;position:relative}
.backdrop{position:fixed;inset:-10%;z-index:-1;background:var(--bg) center/cover;filter:blur(70px) saturate(1.15);opacity:0;transition:opacity .8s ease}
@media (min-width:640px){
  .backdrop{opacity:.45}
  .page{margin:24px auto;border-radius:calc(var(--radius) + 10px);background:var(--bg);box-shadow:var(--shadow);overflow:clip;border:1px solid var(--border)}
}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;max-width:480px;margin:0 auto;
  height:calc(56px + var(--sat));padding:var(--sat) 10px 0 16px;
  display:flex;align-items:center;gap:8px;color:var(--text);
  transition:background-color .3s ease,color .3s ease,border-color .3s ease;
  border-bottom:1px solid transparent;
}
@media (min-width:640px){ .topbar{top:25px;width:478px;border-radius:calc(var(--radius) + 9px) calc(var(--radius) + 9px) 0 0} }
.topbar.over{color:#fff}
.topbar.solid{
  background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom-color:var(--border);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
}
.logo{display:flex;align-items:center;gap:9px;height:44px;font-family:var(--font-body);font-weight:700;font-size:16px;letter-spacing:-.015em;margin-right:auto}
.logo .mark{width:30px;height:30px;border-radius:9px;background:#fff;color:#2326D3;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.logo .mark svg{width:17px;height:18px}
.ib{
  position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--surface-2) 80%,transparent);transition:background-color .2s ease,transform .15s ease;
}
.over .ib{background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib:hover{background:var(--surface-2)}
.over .ib:hover{background:rgba(0,0,0,.42)}
.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px}
.badge-n{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;
  transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);
}
.badge-n.on{transform:scale(1)}
.preview .gear{display:none}

/* ---------- Cover ---------- */
.cover{position:relative;user-select:none;-webkit-user-select:none}
.stage{position:relative;overflow:hidden;background:var(--surface);touch-action:pan-y}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 7s ease-out}
.frame.on{opacity:1;transform:scale(1)}
.stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 22%)}
.ticks{position:absolute;z-index:3;left:14px;right:14px;top:calc(60px + var(--sat));display:flex;gap:4px}
.tick{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
.tick i{display:block;height:100%;width:0;background:#fff}
.tick.sent i{width:100%}
.tick.now i{animation:fill var(--dur,5s) linear forwards}
.paused .tick.now i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.cap{position:absolute;z-index:3;left:16px;right:16px;top:calc(74px + var(--sat));color:rgba(255,255,255,.9);font-size:13px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.45);transition:opacity .4s ease}
.tap{position:absolute;z-index:2;top:0;bottom:0;width:38%}
.tap.prev{left:0}.tap.next{right:0}

.id{position:relative;z-index:4}
.status{display:inline-flex;align-items:center;gap:8px;height:28px;white-space:nowrap;max-width:100%;padding:0 12px 0 10px;border-radius:14px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.status i{width:7px;height:7px;border-radius:50%;background:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,.22)}
.name{
  font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);font-stretch:var(--display-stretch);
  font-size:var(--name-size,58px);line-height:.94;margin-top:14px;overflow-wrap:anywhere;
}
.meta{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--text-dim);font-weight:500}
.meta svg{width:15px;height:15px}
.bio{margin-top:6px;font-size:15.5px;line-height:1.45;color:var(--text-dim);max-width:34ch}
.quick{display:flex;gap:10px;margin-top:22px}
.quick a{flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-align:center;min-width:0}
.quick a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick i{
  width:58px;height:58px;border-radius:var(--radius-btn);display:grid;place-items:center;
  background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s ease,background-color .2s ease;
}
.quick svg{width:23px;height:23px}
.quick a:first-child i{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.quick a:hover i{background:var(--surface-2)}
.quick a:first-child:hover i{background:color-mix(in srgb,var(--accent) 88%,var(--text))}
.quick a:active i{transform:scale(.92)}
.more{display:grid;place-items:center;width:48px;height:40px;margin:10px auto 0;color:var(--text-faint)}
.more svg{width:22px;height:22px;animation:nudge 2.4s ease-in-out 1.6s 3}
@keyframes nudge{50%{transform:translateY(5px)}}
.center .id{text-align:center}
.center .bio{margin-left:auto;margin-right:auto}
.center .meta,.center .quick{justify-content:center}

/* Full screen */
.cover.full{height:100vh;height:100svh;min-height:560px}
@media (min-width:640px){ .cover.full{height:min(calc(100svh - 48px),920px)} }
.cover.full .stage{position:absolute;inset:0}
.cover.full .stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent var(--f0,30%),color-mix(in srgb,var(--bg) 78%,transparent) var(--f1,62%),var(--bg) 100%);transition:background .8s ease}
.cover.full .id{position:absolute;left:0;right:0;bottom:0;padding:0 22px calc(8px + var(--sab))}

/* Framed */
.cover.framed{height:100vh;height:100svh;min-height:600px;display:flex;flex-direction:column;padding-top:calc(60px + var(--sat))}
@media (min-width:640px){ .cover.framed{height:min(calc(100svh - 48px),920px)} }
.cover.framed .stage{flex:1;min-height:0;margin:0 14px;border-radius:var(--radius)}
.cover.framed .stage::before{display:none}
.cover.framed .ticks{top:12px}
.cover.framed .cap{top:24px}
.cover.framed .id{padding:4px 22px calc(8px + var(--sab))}
.cover.framed .name{margin-top:12px;--name-size:46px}
.cover.framed .status{position:absolute;top:-44px;left:16px;color:#fff;background:rgba(0,0,0,.32);border-color:rgba(255,255,255,.18)}
.cover.framed.centerless .status{left:16px}
.center .cover.framed .status,.cover.framed.center .status{left:50%;transform:translateX(-50%)}

/* Minimal (classic link page) */
.cover.minimal{padding:calc(84px + var(--sat)) 22px 8px}
.cover.minimal .stage{display:none}
.avatar{display:none;width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:3px solid var(--surface);box-shadow:var(--shadow)}
.cover.minimal .avatar{display:block}
.center .cover.minimal .avatar,.cover.minimal.center .avatar{margin:0 auto}
.cover.minimal .status{margin-top:18px}
.cover.minimal .name{--name-size:40px}
.cover.minimal .more{display:none}

/* ---------- Sections ---------- */
.sections{padding:10px 18px calc(20px + var(--sab))}
.sec{padding-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 14px}
.sec-h h2{font-family:var(--font-display);font-weight:var(--display-weight);font-stretch:var(--display-stretch);letter-spacing:calc(var(--display-tracking) * .5);font-size:22px;line-height:1.15}
.sec-h a,.sec-h button{font-size:13.5px;font-weight:600;color:var(--accent-text);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:transform .15s ease,background-color .2s ease,opacity .2s ease;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{background:color-mix(in srgb,var(--accent) 88%,var(--text))}
.btn-line{border:1px solid var(--border-strong);background:var(--surface)}
.btn-line:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-block{width:100%}

/* Prints */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 18px;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.print{flex:0 0 44%;scroll-snap-align:start;text-align:left;min-width:0}
.print .ph{aspect-ratio:4/5;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);position:relative}
.print img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,opacity .5s ease}
.print:hover img{transform:scale(1.04)}
.print b{display:block;font-weight:600;font-size:14.5px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print span{font-size:13px;color:var(--text-dim)}

/* Gallery */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:4px;border-radius:var(--radius-sm);overflow:hidden}
.grid button{aspect-ratio:1;overflow:hidden;background:var(--surface-2)}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,opacity .5s ease}
.grid button:hover img{transform:scale(1.05)}

/* Film */
.film{display:block;position:relative;width:100%;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:var(--surface-2);text-align:left}
.film img{width:100%;height:100%;object-fit:cover}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent 62%)}
.film .play{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;display:flex;align-items:center;gap:14px;color:#fff}
.film .play i{width:48px;height:48px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none;transition:transform .2s ease}
.film:hover .play i{transform:scale(1.07)}
.film .play i svg{width:17px;height:17px;margin-left:3px}
.film .play b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.film .play span{font-size:13px;opacity:.8}

/* Links */
.links{list-style:none}
.links a{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);transition:padding .2s ease}
.links li:first-child a{border-top:1px solid var(--border)}
.links a:hover{padding-left:10px}
.links img,.links .ph0{width:50px;height:50px;border-radius:calc(var(--radius-sm) * .8);object-fit:cover;flex:none;background:var(--surface-2)}
.links .t{flex:1;min-width:0}
.links b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15.5px}
.links b em{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.links .t span{display:block;font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links svg{width:16px;height:16px;color:var(--text-faint);flex:none}
.links.cards{display:grid;gap:10px}
.links.cards a,.links.cards li:first-child a{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:12px 14px 12px 12px}
.links.cards a:hover{padding-left:12px;background:var(--surface-2)}

/* Forms */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel > p{color:var(--text-dim);font-size:14.5px;line-height:1.5}
.form{display:grid;gap:12px;margin-top:16px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:grid;gap:6px;font-size:13px;font-weight:600}
.in{
  width:100%;height:48px;padding:0 14px;border-radius:calc(var(--radius-sm) * .85);border:1px solid var(--border-strong);
  background:var(--bg);font-size:16px;font-weight:400;transition:border-color .15s ease,box-shadow .15s ease;appearance:none;-webkit-appearance:none;
}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.in:focus{outline:none;border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.in[aria-invalid=true]{border-color:#e5484d}
.err{font-size:12.5px;font-weight:500;color:#e5484d;min-height:0}
.fine{font-size:12.5px;color:var(--text-faint);line-height:1.45}
.sent{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:14px;border-radius:var(--radius-sm);background:var(--accent-soft)}
.sent i{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.sent i svg{width:16px;height:16px}
.sent b{display:block}
.sent span{font-size:13.5px;color:var(--text-dim)}
.inline{display:flex;gap:8px;margin-top:16px}
.inline .in{flex:1;min-width:0}

/* Socials + footer */
.social{display:flex;flex-wrap:wrap;gap:10px}
.social a{width:50px;height:50px;border-radius:var(--radius-btn);display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);transition:background-color .2s ease,transform .15s ease}
.social a:hover{background:var(--surface-2)}
.social a:active{transform:scale(.94)}
.social svg{width:21px;height:21px}
.center .social{justify-content:center}
.foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:44px;padding-bottom:8px;font-size:12.5px;color:var(--text-faint)}
.foot a{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--text-dim)}
.foot .mk{width:16px;height:17px;color:var(--text-dim)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;
  background:var(--surface);color:var(--text);border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;
  padding:8px 20px calc(22px + var(--sab));max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s;
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:4px auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.sh-head h3{font-family:var(--font-display);font-weight:var(--display-weight);font-stretch:var(--display-stretch);letter-spacing:calc(var(--display-tracking) * .6);font-size:24px;line-height:1.15}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.x svg{width:16px;height:16px}

/* Print detail */
.art{display:grid;place-items:center;padding:22px;border-radius:var(--radius-sm);background:var(--surface-2);margin:8px 0 18px;transition:background-color .3s ease}
.art .fr{border:0 solid transparent;transition:border-color .3s ease,border-width .3s ease,padding .3s ease,box-shadow .3s ease;background:#fff;max-width:72%}
.art .fr.framed{border-width:10px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.art .fr:not(.framed){padding:0;background:transparent;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.art img{aspect-ratio:4/5;width:100%;object-fit:cover}
.sh-sub{color:var(--text-dim);font-size:14.5px;line-height:1.5;margin-top:2px}
.opt{margin-top:18px}
.opt > b{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}
.opt > b span{color:var(--text-dim);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.chip{border:1.5px solid var(--border);border-radius:calc(var(--radius-sm) * .85);padding:9px 6px;text-align:center;background:var(--bg);transition:border-color .15s ease,background-color .15s ease}
.chip b{display:block;font-size:14px;font-weight:600}
.chip span{display:block;font-size:12px;color:var(--text-dim);margin-top:1px}
.chip[aria-pressed=true]{border-color:var(--accent-text);background:var(--accent-soft)}
.chip .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--border-strong)}
.buy{display:flex;gap:10px;align-items:center;margin-top:22px}
.stepper{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:calc(var(--radius-sm) * .85);height:50px;flex:none}
.stepper button{width:40px;height:100%;display:grid;place-items:center;color:var(--text-dim)}
.stepper button:hover{color:var(--text)}
.stepper svg{width:16px;height:16px}
.stepper output{min-width:22px;text-align:center;font-weight:600}
.buy .btn{flex:1}

/* Cart */
.cart{list-style:none;margin-top:8px}
.cart li{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.cart img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.cart .t{flex:1;min-width:0}
.cart .t b{display:block;font-weight:600}
.cart .t span{display:block;font-size:12.5px;color:var(--text-dim)}
.cart .r{text-align:right;display:grid;gap:6px;justify-items:end}
.cart .stepper{height:34px}
.cart .stepper button{width:30px}
.totals{display:grid;gap:6px;margin-top:16px;font-size:14px}
.totals div{display:flex;justify-content:space-between;color:var(--text-dim)}
.totals div:last-child{color:var(--text);font-weight:700;font-size:17px;padding-top:8px;border-top:1px solid var(--border)}
.empty{text-align:center;padding:28px 0 8px;color:var(--text-dim)}
.empty svg{width:40px;height:40px;color:var(--text-faint);margin:0 auto 10px}

/* Share */
.urlbox{display:flex;align-items:center;gap:10px;margin-top:14px;padding:6px 6px 6px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg)}
.urlbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--text-dim)}
.urlbox .btn{height:40px;padding:0 14px;font-size:14px}
.tip{display:flex;gap:10px;margin-top:16px;font-size:13.5px;color:var(--text-dim);line-height:1.45}
.tip svg{width:18px;height:18px;flex:none;color:var(--accent-text);margin-top:1px}

/* Video */
.video{aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:#000;margin-top:8px}
.video iframe{width:100%;height:100%;border:0;display:block}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,7,10,.96);color:#fff;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s ease}
.lb.open{opacity:1;pointer-events:auto}
.lb header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--sat)) 12px 10px 18px;font-size:13.5px;color:rgba(255,255,255,.75)}
.lb .x{background:rgba(255,255,255,.12);color:#fff}
.lb .view{flex:1;min-height:0;display:grid;place-items:center;position:relative;touch-action:pan-y}
.lb .view img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .25s ease,transform .25s ease}
.lb footer{padding:14px 18px calc(18px + var(--sab));text-align:center;font-size:14.5px;min-height:56px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.lb .nav svg{width:18px;height:18px}
.lb .nav.p{left:12px}.lb .nav.p svg{transform:rotate(180deg)}
.lb .nav.n{right:12px}
@media (hover:none){ .lb .nav{display:none} }

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--sab));z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,.3);transition:opacity .25s ease,transform .25s ease;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet.open ~ .toast{bottom:auto;top:calc(14px + var(--sat))}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .frame{transform:none}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <a class="logo" id="logo" href="https://sportshutter.com/"><span class="mark" id="mark"></span><span id="product">ShutterLink</span></a>
  <button class="ib" id="shareBtn" aria-label="Share this page"></button>
  <button class="ib" id="cartBtn" aria-label="Cart, empty"><span class="badge-n num" id="cartN">0</span></button>
  <a class="ib gear" id="gear" href="settings.html" aria-label="Page settings"></a>
</header>

<main class="page" id="page">
  <section class="cover" id="cover" aria-label="Profile">
    <div class="stage" id="stage" aria-roledescription="slideshow" aria-label="Recent work">
      <div class="ticks" id="ticks"></div>
      <p class="cap" id="cap" aria-live="polite"></p>
      <button class="tap prev" id="prev" aria-label="Previous photo"></button>
      <button class="tap next" id="next" aria-label="Next photo"></button>
    </div>
    <div class="id">
      <img class="avatar fade" id="avatar" alt="">
      <span class="status" id="status"><i></i><span></span></span>
      <h1 class="name" id="name"></h1>
      <p class="meta" id="meta"></p>
      <p class="bio" id="bio"></p>
      <nav class="quick" id="quick" aria-label="Quick links"></nav>
      <a class="more" id="more" href="#sections" aria-label="Scroll to more"></a>
    </div>
  </section>

  <div class="sections" id="sections"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Gallery" hidden>
  <header><span id="lbCount" class="num"></span><button class="x" id="lbClose" aria-label="Close gallery"></button></header>
  <div class="view" id="lbView"><img id="lbImg" alt=""><button class="nav p" id="lbPrev" aria-label="Previous photo"></button><button class="nav n" id="lbNext" aria-label="Next photo"></button></div>
  <footer id="lbCap"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const I = SL.ICONS, esc = SL.esc;
const PREVIEW = new URLSearchParams(location.search).has('preview');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (PREVIEW) document.documentElement.classList.add('preview');

let cfg = SL.load();
const tintCache = new Map();

/* static chrome */
$('mark').innerHTML = SL.BRAND.logo;
$('product').textContent = SL.BRAND.product || 'ShutterLink';
$('logo').setAttribute('aria-label', `${SL.BRAND.product} by ${SL.BRAND.name}, go to the ${SL.BRAND.name} home page`);
$('shareBtn').innerHTML = I.share;
$('cartBtn').insertAdjacentHTML('afterbegin', I.bag);
$('gear').innerHTML = I.gear;
$('more').innerHTML = I.down;
$('lbClose').innerHTML = I.close;
$('lbPrev').innerHTML = I.chevron; $('lbNext').innerHTML = I.chevron;

/* ---------- Links & destinations ---------- */
function ext(url, demo){
  const h = SL.href(url);
  if (h) return `href="${esc(h)}"${/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : ''}`;
  return `href="#" data-demo="${esc(demo)}"`;
}
function quickAttrs(q){
  const jump = { shop:'shop', gallery:'gallery', enquire:'enquire', newsletter:'newsletter' }[q.type];
  if (jump) return on(jump) ? `href="#sec-${jump}"` : `href="#" data-demo="${esc(SL.ACTIONS[q.type].label)} (section is turned off)"`;
  if (q.type === 'film') return `href="#sec-film" data-film`;
  if (SL.ACTIONS[q.type].social) return ext(cfg.socials[q.type], SL.ACTIONS[q.type].label);
  return ext(q.url, q.label || 'that link');
}
const on = id => (cfg.sections.find(s => s.id === id) || {}).on;
const title = id => esc((cfg.sections.find(s => s.id === id) || {}).title || '');

/* ---------- Render ---------- */
function render(){
  const p = cfg.profile, t = cfg.theme, c = cfg.cover;
  document.title = `${p.name} · Photography`;
  document.body.classList.toggle('center', t.align === 'center');

  const cover = $('cover');
  cover.className = 'cover ' + c.style;
  const f0 = Math.max(5, 100 - c.overlay * 1.25), f1 = f0 + (100 - f0) * .5;
  cover.style.setProperty('--f0', f0 + '%'); cover.style.setProperty('--f1', f1 + '%');

  $('avatar').src = SL.sized(p.avatar || (c.photos[0] || {}).url, 300, 300);
  $('status').hidden = !(p.status.on && p.status.text.trim());
  $('status').lastElementChild.textContent = p.status.text;
  $('name').textContent = p.name;
  $('meta').innerHTML = p.location.trim() ? I.pin + `<span>${esc(p.location)}</span>` : '';
  $('meta').hidden = !p.location.trim();
  $('bio').textContent = p.bio; $('bio').hidden = !p.bio.trim();
  $('quick').innerHTML = cfg.quick.map(q =>
    `<a ${quickAttrs(q)}><i>${I[q.type] || I.link}</i><span>${esc(q.label || SL.ACTIONS[q.type].label)}</span></a>`).join('');
  $('quick').hidden = !cfg.quick.length;
  $('gear').hidden = !cfg.page.showGear;

  renderSections();
  renderStage();
  fitName();
  onScroll();
}

function fitName(){
  const n = $('name'), max = { full:58, framed:46, minimal:40 }[cfg.cover.style] || 58;
  let size = max; n.style.setProperty('--name-size', size + 'px');
  // shrink long names until every word fits on its line
  const words = n.textContent.split(/\s+/);
  const tooWide = () => n.scrollWidth > n.clientWidth + 1;
  n.textContent = words.join(' ');
  let guard = 0;
  while ((tooWide() || longestWord(n) > n.clientWidth) && size > 26 && guard++ < 40){ size -= 2; n.style.setProperty('--name-size', size + 'px'); }
}
function longestWord(n){
  const r = document.createRange(); let w = 0;
  const span = document.createElement('span'); span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
  n.appendChild(span);
  n.textContent.split(/\s+/).forEach(word => { span.textContent = word; w = Math.max(w, span.getBoundingClientRect().width); });
  span.remove(); return w;
}

/* ---------- Sections ---------- */
const S = {};
S.shop = () => {
  const items = cfg.shop.featured.map(id => SL.SHOP.find(p => p.id === id)).filter(Boolean);
  if (!items.length) return '';
  return `<div class="sec-h"><h2>${title('shop')}</h2><a href="#" data-demo="your full Sport Shutter shop">Shop all</a></div>
    <div class="strip">${items.map(p => `
      <button class="print" data-print="${p.id}" aria-label="${esc(p.title)}${cfg.shop.showPrices ? ', from ' + SL.money(p.from, cfg.shop.currency) : ''}">
        <div class="ph"><img class="fade" src="${SL.pic(p.pid,440,550)}" alt="" loading="lazy" decoding="async"></div>
        <b>${esc(p.title)}</b>${cfg.shop.showPrices ? `<span class="num">From ${SL.money(p.from, cfg.shop.currency)}</span>` : ''}
      </button>`).join('')}</div>`;
};
S.gallery = () => {
  const ph = cfg.gallery.photos.filter(g => g.url);
  if (!ph.length) return '';
  return `<div class="sec-h"><h2>${title('gallery')}</h2><button data-lb="0">View all</button></div>
    <div class="grid" style="--cols:${cfg.gallery.columns}">${ph.map((g,i) => `
      <button data-lb="${i}" aria-label="Open photo ${i+1}${g.caption ? ': ' + esc(g.caption) : ''}"><img class="fade" src="${esc(SL.sized(g.url,400,400))}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>`;
};
S.film = () => {
  const f = cfg.film, yt = SL.youtubeId(f.url);
  const thumb = f.thumb || (yt ? `https://i.ytimg.com/vi/${yt}/hqdefault.jpg` : '');
  if (!f.title && !thumb) return '';
  return `<div class="sec-h"><h2>${title('film')}</h2></div>
    <button class="film" data-film aria-label="Play ${esc(f.title)}">
      ${thumb ? `<img class="fade" src="${esc(SL.sized(thumb,960,540))}" alt="" loading="lazy" decoding="async">` : ''}
      <div class="play"><i>${I.play}</i><div><b>${esc(f.title)}</b>${f.meta ? `<span>${esc(f.meta)}</span>` : ''}</div></div>
    </button>`;
};
S.links = () => {
  const ls = cfg.links.filter(l => l.on && l.title.trim());
  if (!ls.length) return '';
  return `<div class="sec-h"><h2>${title('links')}</h2></div>
    <ul class="links ${cfg.theme.linkStyle === 'cards' ? 'cards' : ''}">${ls.map(l => `
      <li><a ${ext(l.url, l.title)}>
        ${l.thumb ? `<img class="fade" src="${esc(SL.sized(l.thumb,120,120))}" alt="" loading="lazy" decoding="async">` : ''}
        <div class="t"><b>${esc(l.title)}${l.badge ? `<em>${esc(l.badge)}</em>` : ''}</b>${l.sub ? `<span>${esc(l.sub)}</span>` : ''}</div>
        ${I.chevron}</a></li>`).join('')}</ul>`;
};
S.enquire = () => {
  const e = cfg.enquire;
  const types = e.types.split(',').map(x => x.trim()).filter(Boolean);
  return `<div class="sec-h"><h2>${title('enquire')}</h2></div>
    <div class="panel">
      ${e.intro ? `<p>${esc(e.intro)}</p>` : ''}
      <form class="form" id="enqForm" novalidate>
        <div class="row">
          <label class="fl">Name<input class="in" name="name" autocomplete="name" required><span class="err" hidden>Add your name</span></label>
          <label class="fl">Email<input class="in" name="email" type="email" autocomplete="email" inputmode="email" required><span class="err" hidden>Add an email address like you@example.com</span></label>
        </div>
        <div class="row">
          ${types.length ? `<label class="fl">Type of shoot<select class="in" name="type">${types.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>` : ''}
          <label class="fl">Date <input class="in" name="date" type="date"></label>
        </div>
        <label class="fl">Message<textarea class="in" name="msg" rows="3" required></textarea><span class="err" hidden>Add a short message</span></label>
        <button class="btn btn-accent btn-block" type="submit">Send enquiry</button>
        ${e.reply ? `<p class="fine">${esc(e.reply)}</p>` : ''}
      </form>
    </div>`;
};
S.newsletter = () => {
  const n = cfg.newsletter;
  return `<div class="sec-h"><h2>${title('newsletter')}</h2></div>
    <div class="panel">
      ${n.blurb ? `<p>${esc(n.blurb)}</p>` : ''}
      <form class="inline" id="nlForm" novalidate>
        <label class="sr" for="nlEmail">Email address</label>
        <input class="in" id="nlEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
        <button class="btn btn-accent" type="submit">${esc(n.button || 'Subscribe')}</button>
      </form>
      <p class="err" id="nlErr" hidden style="margin-top:8px">Add an email address like you@example.com</p>
    </div>`;
};
S.socials = () => {
  const keys = Object.keys(SL.SOCIALS);
  const set = keys.filter(k => cfg.socials[k] && SL.href(cfg.socials[k]));
  const show = set.length ? set : ['instagram','tiktok','youtube','email'];
  return `<div class="sec-h"><h2>${title('socials')}</h2></div>
    <nav class="social" aria-label="Social profiles">${show.map(k =>
      `<a ${ext(cfg.socials[k], SL.SOCIALS[k].label)} aria-label="${SL.SOCIALS[k].label}">${I[k]}</a>`).join('')}</nav>`;
};

function renderSections(){
  const html = cfg.sections.filter(s => s.on && S[s.id]).map(s => {
    const inner = S[s.id](); return inner ? `<section class="sec" id="sec-${s.id}">${inner}</section>` : '';
  }).join('');
  $('sections').innerHTML = html + (cfg.page.footer
    ? `<footer class="foot">Powered by <a ${PREVIEW ? 'href="#" data-demo="sportshutter.com"' : `href="${SL.BRAND.home}"`}><span class="mk">${SL.BRAND.logo}</span>${SL.BRAND.name}</a></footer>` : '');
  $('more').hidden = !html;
  wireForms();
  markLoaded($('sections'));
}

/* fade-in images, including ones already in cache */
function markLoaded(root){
  root.querySelectorAll('img.fade').forEach(im => { if (im.complete && im.naturalWidth) im.classList.add('ready'); });
}
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('ready'); }, true);
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
document.addEventListener('error', e => {
  const im = e.target; if (im.tagName !== 'IMG' || im.src === BLANK) return;
  // a missing photo becomes a quiet placeholder instead of a broken-image icon
  if (im.classList.contains('frame')) im.classList.add('broken');
  else { im.alt = ''; im.src = BLANK; im.classList.add('ready'); }
}, true);

/* ---------- Cover slideshow ---------- */
const stage = $('stage'), ticks = $('ticks'), cap = $('cap');
let idx = 0, timer = null, frames = [], photos = [];
function renderStage(){
  stage.querySelectorAll('.frame').forEach(e => e.remove());
  photos = cfg.cover.style === 'minimal' ? [] : cfg.cover.photos.filter(p => p.url);
  frames = photos.map((p,i) => {
    const im = new Image();
    im.className = 'frame'; im.alt = p.caption || ''; im.decoding = 'async';
    if (i > 1) im.loading = 'lazy';
    im.src = SL.sized(p.url, 1080, 1350);
    stage.insertBefore(im, ticks);
    return im;
  });
  ticks.innerHTML = photos.map(() => '<div class="tick"><i></i></div>').join('');
  ticks.hidden = photos.length < 2;
  ticks.style.setProperty('--dur', cfg.cover.seconds + 's');
  cap.hidden = !cfg.cover.captions;
  if (idx >= photos.length) idx = 0;
  show(idx);
}
function show(n){
  clearTimeout(timer);
  if (!photos.length){ paint(null); return; }
  idx = (n + photos.length) % photos.length;
  frames.forEach((el,i) => el.classList.toggle('on', i === idx));
  ticks.querySelectorAll('.tick').forEach((t,i) => {
    t.className = 'tick' + (i < idx ? ' done' : i === idx ? ' now' : '');
    const b = t.firstChild; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  });
  const p = photos[idx];
  cap.textContent = p.caption || '';
  $('backdrop').style.backgroundImage = `url("${SL.sized(p.url, 400, 500)}")`;
  if (frames[idx + 1]) frames[idx + 1].loading = 'eager';
  tintFor(p.url).then(t => { if (photos[idx] === p) paint(t); });
  if (!reduce && photos.length > 1 && !document.hidden) timer = setTimeout(() => show(idx + 1), cfg.cover.seconds * 1000);
}
function tintFor(url){
  if (!cfg.theme.photoTint) return Promise.resolve(null);
  const key = SL.sized(url, 60, 60);
  if (!tintCache.has(key)) tintCache.set(key, SL.sampleColour(key));
  return tintCache.get(key);
}
function paint(tint){
  const tk = SL.applyTheme(cfg, document.documentElement, tint);
  document.querySelector('meta[name=theme-color]').content = tk['--bg'];
}
$('prev').onclick = () => show(idx - 1);
$('next').onclick = () => show(idx + 1);
// hold to pause, swipe to change
let px = null, held = false, holdT;
stage.addEventListener('pointerdown', e => {
  px = e.clientX; holdT = setTimeout(() => { held = true; stage.classList.add('paused'); clearTimeout(timer); }, 180);
});
stage.addEventListener('pointerup', e => {
  clearTimeout(holdT);
  const dx = px === null ? 0 : e.clientX - px; px = null;
  if (held){ held = false; stage.classList.remove('paused'); if (Math.abs(dx) < 40){ show(idx); return; } }
  if (Math.abs(dx) > 40){ e.preventDefault(); show(idx + (dx < 0 ? 1 : -1)); swallow = true; }
});
stage.addEventListener('pointercancel', () => { clearTimeout(holdT); px = null; if (held){ held = false; stage.classList.remove('paused'); show(idx); } });
let swallow = false;
stage.addEventListener('click', e => { if (swallow){ e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) show(idx); else clearTimeout(timer); });
addEventListener('keydown', e => {
  if (sheetOpen() || lbOpen() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (scrollY > innerHeight * .6) return;
  if (e.key === 'ArrowRight') show(idx + 1);
  if (e.key === 'ArrowLeft') show(idx - 1);
});

/* ---------- Top bar ---------- */
const topbar = $('topbar');
function onScroll(){
  const full = cfg.cover.style === 'full';
  const past = scrollY > (full ? $('cover').offsetHeight * .45 : 8);
  topbar.classList.toggle('solid', past || (!full && scrollY > 8));
  topbar.classList.toggle('over', full && !past);
}
addEventListener('scroll', onScroll, { passive:true });
addEventListener('resize', () => { fitName(); onScroll(); });

/* ---------- Sheet ---------- */
const sheet = $('sheet'), scrim = $('scrim');
let lastFocus = null;
const sheetOpen = () => sheet.classList.contains('open');
function openSheet(html, label){
  if (!sheetOpen()) lastFocus = document.activeElement;
  sheet.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  sheet.setAttribute('aria-label', label);
  sheet.scrollTop = 0;
  sheet.classList.add('open'); scrim.classList.add('open');
  document.body.style.overflow = 'hidden';
  markLoaded(sheet);
  sheet.querySelectorAll('[data-close]').forEach(b => { b.innerHTML = I.close; b.onclick = closeSheet; });
  setTimeout(() => (sheet.querySelector('[data-focus]') || sheet.querySelector('button,a,input') || sheet).focus({ preventScroll:true }), 60);
}
function closeSheet(){
  if (!sheetOpen()) return;
  sheet.classList.remove('open'); scrim.classList.remove('open');
  document.body.style.overflow = '';
  const v = sheet.querySelector('iframe'); if (v) setTimeout(() => { if (!sheetOpen()) sheet.innerHTML = ''; }, 450);
  lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll:true });
}
scrim.onclick = closeSheet;
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (lbOpen()) closeLb(); else closeSheet(); }
  if (e.key === 'Tab' && sheetOpen()) trap(e, sheet);
  if (e.key === 'Tab' && lbOpen()) trap(e, $('lb'));
});
function trap(e, root){
  const f = [...root.querySelectorAll('button,a[href],input,select,textarea,iframe')].filter(x => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
let y0 = null;
sheet.addEventListener('touchstart', e => { y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive:true });
sheet.addEventListener('touchmove', e => {
  if (y0 === null) return; const dy = e.touches[0].clientY - y0;
  if (dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
}, { passive:true });
sheet.addEventListener('touchend', e => {
  if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 90) closeSheet();
});

/* ---------- Prints ---------- */
const O = SL.PRINT_OPTIONS;
function priceOf(p, sel){
  const size = O.sizes.find(x => x.id === sel.size), paper = O.papers.find(x => x.id === sel.paper), fr = O.frames.find(x => x.id === sel.frame);
  return Math.round(p.from * size.mult + paper.add + fr.add * size.mult);
}
function openPrint(id){
  const p = SL.SHOP.find(x => x.id === id); if (!p) return;
  const sel = { size:'a4', paper:'rag', frame:'none', qty:1 };
  const cur = cfg.shop.currency;
  const chips = (group, list, extra) => `<div class="chips" role="radiogroup" aria-label="${group}" style="--n:${list.length}">${list.map(o =>
    `<button class="chip" role="radio" data-g="${group}" data-v="${o.id}" aria-checked="${o.id === sel[group]}" aria-pressed="${o.id === sel[group]}">${extra ? extra(o) : ''}<b>${o.label}</b>${o.note ? `<span>${o.note}</span>` : ''}</button>`).join('')}</div>`;
  openSheet(`
    <div class="sh-head"><h3>${esc(p.title)}</h3><button class="x" data-close aria-label="Close"></button></div>
    <p class="sh-sub">${esc(p.blurb)}</p>
    <div class="art" id="art"><div class="fr" id="fr"><img class="fade" src="${SL.pic(p.pid,640,800)}" alt="${esc(p.title)}"></div></div>
    <div class="opt"><b>Size</b>${chips('size', O.sizes)}</div>
    <div class="opt"><b>Paper</b>${chips('paper', O.papers)}</div>
    <div class="opt"><b>Frame <span id="frNote"></span></b>${chips('frame', O.frames, o => o.id === 'none' ? '' : `<i class="sw" style="background:${o.css}"></i>`)}</div>
    <div class="buy">
      <div class="stepper" role="group" aria-label="Quantity"><button data-q="-1" aria-label="One fewer">${I.minus}</button><output id="qty" class="num" aria-live="polite">1</output><button data-q="1" aria-label="One more">${I.plus}</button></div>
      <button class="btn btn-accent" id="add" data-focus>Add to cart</button>
    </div>
    <p class="fine" style="margin-top:12px;text-align:center">Printed and shipped by ${SL.BRAND.name}. Usually ships in 5 working days.</p>`, p.title);
  const upd = () => {
    sheet.querySelectorAll('.chip').forEach(c => { const v = sel[c.dataset.g] === c.dataset.v; c.setAttribute('aria-pressed', v); c.setAttribute('aria-checked', v); });
    const fr = O.frames.find(x => x.id === sel.frame);
    const box = $('fr'); box.classList.toggle('framed', fr.id !== 'none'); box.style.borderColor = fr.id === 'none' ? 'transparent' : fr.css;
    $('frNote').textContent = fr.id === 'none' ? '' : `+${SL.money(fr.add * O.sizes.find(x => x.id === sel.size).mult, cur)}`;
    $('qty').textContent = sel.qty;
    $('add').textContent = cfg.shop.showPrices ? `Add to cart · ${SL.money(priceOf(p, sel) * sel.qty, cur)}` : 'Add to cart';
  };
  sheet.onclick = e => {
    const c = e.target.closest('.chip'); if (c){ sel[c.dataset.g] = c.dataset.v; upd(); }
    const q = e.target.closest('[data-q]'); if (q){ sel.qty = Math.max(1, Math.min(20, sel.qty + +q.dataset.q)); upd(); }
  };
  $('add').onclick = () => {
    const key = [p.id, sel.size, sel.paper, sel.frame].join('|');
    const ex = cart.find(x => x.key === key);
    if (ex) ex.qty = Math.min(20, ex.qty + sel.qty); else cart.push({ key, id:p.id, size:sel.size, paper:sel.paper, frame:sel.frame, qty:sel.qty });
    saveCart(); closeSheet();
    toast(`Added ${sel.qty > 1 ? sel.qty + ' × ' : ''}${p.title} to your cart`);
    const b = $('cartBtn'); b.animate && !reduce && b.animate([{ transform:'scale(1)' },{ transform:'scale(1.18)' },{ transform:'scale(1)' }], { duration:350 });
  };
  upd();
}

/* ---------- Cart (kept for this visit) ---------- */
let cart = [];
try { cart = JSON.parse(sessionStorage.getItem('shutterlink:cart') || '[]').filter(x => SL.SHOP.some(p => p.id === x.id)); } catch(_) {}
function saveCart(){
  try { sessionStorage.setItem('shutterlink:cart', JSON.stringify(cart)); } catch(_) {}
  const n = cart.reduce((a,x) => a + x.qty, 0);
  $('cartN').textContent = n; $('cartN').classList.toggle('on', n > 0);
  $('cartBtn').setAttribute('aria-label', n ? `Cart, ${n} item${n > 1 ? 's' : ''}` : 'Cart, empty');
}
function openCart(){
  const cur = cfg.shop.currency;
  if (!cart.length){
    openSheet(`<div class="sh-head"><h3>Your cart</h3><button class="x" data-close aria-label="Close"></button></div>
      <div class="empty">${I.bag}<p>Nothing here yet. Prints you add will show up here.</p></div>
      <button class="btn btn-accent btn-block" id="browse" style="margin-top:18px" data-focus>Browse prints</button>`, 'Your cart');
    $('browse').onclick = () => { closeSheet(); const s = $('sec-shop'); if (s) s.scrollIntoView(); };
    return;
  }
  const rows = cart.map((x,i) => {
    const p = SL.SHOP.find(q => q.id === x.id);
    const each = priceOf(p, x);
    const lab = [O.sizes.find(s => s.id === x.size).label, O.papers.find(s => s.id === x.paper).label, O.frames.find(s => s.id === x.frame).label].join(', ');
    return `<li><img src="${SL.pic(p.pid,112,140)}" alt="">
      <div class="t"><b>${esc(p.title)}</b><span>${lab}</span></div>
      <div class="r"><b class="num">${SL.money(each * x.qty, cur)}</b>
        <div class="stepper" role="group" aria-label="Quantity of ${esc(p.title)}"><button data-i="${i}" data-d="-1" aria-label="${x.qty === 1 ? 'Remove' : 'One fewer'}">${I.minus}</button><output class="num">${x.qty}</output><button data-i="${i}" data-d="1" aria-label="One more">${I.plus}</button></div></div></li>`;
  }).join('');
  const sub = cart.reduce((a,x) => a + priceOf(SL.SHOP.find(q => q.id === x.id), x) * x.qty, 0);
  const ship = sub >= 250 ? 0 : 15;
  openSheet(`<div class="sh-head"><h3>Your cart</h3><button class="x" data-close aria-label="Close"></button></div>
    <ul class="cart">${rows}</ul>
    <div class="totals num"><div><span>Subtotal</span><span>${SL.money(sub, cur)}</span></div>
      <div><span>Shipping${ship ? ` (free over ${SL.money(250, cur)})` : ''}</span><span>${ship ? SL.money(ship, cur) : 'Free'}</span></div>
      <div><span>Total</span><span>${SL.money(sub + ship, cur)}</span></div></div>
    <button class="btn btn-accent btn-block" id="checkout" style="margin-top:18px" data-focus>Check out</button>
    <p class="fine" style="margin-top:10px;text-align:center">Secure checkout on ${SL.BRAND.name}.</p>`, 'Your cart');
  sheet.onclick = e => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    const i = +b.dataset.i; cart[i].qty += +b.dataset.d;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    saveCart(); openCart();
  };
  $('checkout').onclick = () => { closeSheet(); toast(`Prototype: this hands off to ${SL.BRAND.name} checkout`); };
}
$('cartBtn').onclick = openCart;

/* ---------- Film ---------- */
function playFilm(){
  const f = cfg.film, yt = SL.youtubeId(f.url), h = SL.href(f.url);
  if (yt){
    openSheet(`<div class="sh-head"><h3>${esc(f.title)}</h3><button class="x" data-close aria-label="Close video" data-focus></button></div>
      <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1" title="${esc(f.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      ${f.meta ? `<p class="fine" style="margin-top:10px">${esc(f.meta)}</p>` : ''}`, f.title);
  } else if (h && !PREVIEW) window.open(h, '_blank', 'noopener');
  else toast(h ? 'Links open on the live page' : 'Prototype: add a YouTube link in settings to play it here');
}

/* ---------- Gallery lightbox ---------- */
const lb = $('lb'); let li = 0, lbLast = null;
const lbOpen = () => lb.classList.contains('open');
const gal = () => cfg.gallery.photos.filter(g => g.url);
function openLb(i){
  lbLast = document.activeElement; lb.hidden = false;
  requestAnimationFrame(() => lb.classList.add('open'));
  document.body.style.overflow = 'hidden';
  lbShow(i); $('lbClose').focus();
}
function lbShow(i){
  const g = gal(); if (!g.length) return;
  li = (i + g.length) % g.length;
  const img = $('lbImg'); img.style.opacity = 0;
  const src = SL.sized(g[li].url, 1400, 1400);
  const pre = new Image(); pre.onload = pre.onerror = () => { img.src = src; img.alt = g[li].caption || `Photo ${li+1}`; img.style.opacity = 1; }; pre.src = src;
  $('lbCount').textContent = `${li + 1} of ${g.length}`;
  $('lbCap').textContent = g[li].caption || '';
  const nx = new Image(); nx.src = SL.sized(g[(li + 1) % g.length].url, 1400, 1400);
}
function closeLb(){
  lb.classList.remove('open'); document.body.style.overflow = '';
  setTimeout(() => { if (!lbOpen()) lb.hidden = true; }, 260);
  lbLast && lbLast.focus({ preventScroll:true });
}
$('lbClose').onclick = closeLb;
$('lbPrev').onclick = () => lbShow(li - 1);
$('lbNext').onclick = () => lbShow(li + 1);
addEventListener('keydown', e => { if (!lbOpen()) return; if (e.key === 'ArrowRight') lbShow(li + 1); if (e.key === 'ArrowLeft') lbShow(li - 1); });
let lx = null;
$('lbView').addEventListener('pointerdown', e => { lx = e.clientX; });
$('lbView').addEventListener('pointerup', e => {
  if (lx === null) return; const dx = e.clientX - lx; lx = null;
  if (Math.abs(dx) > 40) lbShow(li + (dx < 0 ? 1 : -1));
  else if (e.target === $('lbView')) closeLb();
});

/* ---------- Forms ---------- */
const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
function wireForms(){
  const f = $('enqForm');
  if (f){
    const check = el => {
      const ok = el.name === 'email' ? emailOk(el.value) : el.value.trim().length > 0;
      el.setAttribute('aria-invalid', !ok); const er = el.parentElement.querySelector('.err'); if (er) er.hidden = ok;
      return ok;
    };
    // errors clear as soon as the field is fixed, so nothing shifts under a tap
    f.querySelectorAll('[required]').forEach(el => el.addEventListener('input', () => { if (el.getAttribute('aria-invalid') === 'true') check(el); }));
    f.onsubmit = e => {
      e.preventDefault();
      const bad = [...f.querySelectorAll('[required]')].filter(el => !check(el));
      if (bad.length){ bad[0].focus(); return; }
      const d = Object.fromEntries(new FormData(f));
      const first = d.name.trim().split(/\s+/)[0];
      const to = SL.href(cfg.enquire.to);
      const mail = to.startsWith('mailto:') ? `${to}?subject=${encodeURIComponent((d.type || 'Enquiry') + ' enquiry from ' + d.name)}&body=${encodeURIComponent(`${d.msg}\n\n${d.date ? 'Date: ' + d.date + '\n' : ''}Reply to: ${d.email}`)}` : '';
      f.outerHTML = `<div class="sent" tabindex="-1" id="enqDone"><i>${I.check}</i><div><b>Thanks, ${esc(first)}. Your enquiry is ready.</b>
        <span>${esc(cfg.enquire.reply || '')} ${mail ? `<a href="${esc(mail)}" style="color:var(--accent-text);font-weight:600">Open it in your email app</a>` : 'Prototype: enquiries will arrive in your Sport Shutter inbox.'}</span></div></div>`;
      $('enqDone').focus();
    };
  }
  const n = $('nlForm');
  if (n){
    n.onsubmit = e => {
      e.preventDefault();
      const v = $('nlEmail').value;
      if (!emailOk(v)){ $('nlEmail').setAttribute('aria-invalid', 'true'); $('nlErr').hidden = false; $('nlEmail').focus(); return; }
      n.outerHTML = `<div class="sent" tabindex="-1" id="nlDone"><i>${I.check}</i><div><b>You’re on the list.</b><span>Look out for the next issue at ${esc(v.trim())}.</span></div></div>`;
      $('nlErr').hidden = true; $('nlDone').focus();
    };
    $('nlEmail').oninput = () => { $('nlEmail').removeAttribute('aria-invalid'); $('nlErr').hidden = true; };
  }
}

/* ---------- Share ---------- */
const pageUrl = () => location.href.split(/[?#]/)[0].replace(/index\.html$/, '');
$('shareBtn').onclick = () => {
  openSheet(`<div class="sh-head"><h3>Share this page</h3><button class="x" data-close aria-label="Close"></button></div>
    <div class="urlbox"><span id="shareUrl">${esc(pageUrl().replace(/^https?:\/\//,''))}</span><button class="btn btn-accent" id="copy" data-focus>${I.copy}Copy</button></div>
    ${navigator.share ? `<button class="btn btn-line btn-block" id="native" style="margin-top:10px">${I.share}More ways to share</button>` : ''}
    <p class="tip">${I.instagram}<span>Paste this link into the website field of your Instagram profile so it shows in your bio.</span></p>`, 'Share');
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(pageUrl()); }
    catch(_){ const r = document.createRange(); r.selectNodeContents($('shareUrl')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); } catch(_){} }
    $('copy').innerHTML = I.check + 'Copied'; toast('Link copied');
  };
  if ($('native')) $('native').onclick = () => navigator.share({ title: document.title, url: pageUrl() }).catch(() => {});
};

/* ---------- Global clicks ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const d = t.closest('[data-demo]'); if (d){ e.preventDefault(); toast(`Prototype: this would open ${d.dataset.demo}`); return; }
  if (t.closest('[data-film]')){ e.preventDefault(); playFilm(); return; }
  const pr = t.closest('[data-print]'); if (pr){ openPrint(pr.dataset.print); return; }
  const g = t.closest('[data-lb]'); if (g){ openLb(+g.dataset.lb); return; }
  if (PREVIEW){
    const a = t.closest('a[href]');
    if (a && !a.getAttribute('href').startsWith('#')){ e.preventDefault(); toast('Links open on the live page'); }
  }
});

let tt;
function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600); }

/* ---------- Live updates from settings ---------- */
addEventListener('message', e => {
  if (e.source !== parent || !e.data) return;
  if (e.data.type === 'shutterlink:config'){
    try { cfg = SL.normalise(e.data.config); render(); } catch(err){ console.warn(err); }
  }
  if (e.data.type === 'shutterlink:focus'){
    const map = { profile:'cover', design:'cover', cover:'cover', buttons:'cover' };
    const el = $(map[e.data.tab] || 'sec-' + e.data.tab);
    if (el) (map[e.data.tab] ? scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' }) : el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block:'start' }));
  }
});
addEventListener('storage', e => { if (e.key === SL.KEY){ cfg = SL.load(); render(); } });

saveCart();
render();
markLoaded(document);
})();
</script>
</body>
